[platformio]
default_envs = rp2040_zero

[env:rp2040_zero]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    Wire
    SPI

build_flags =
    -DARDUINO_ARCH_RP2040
    -DPICO_BOARD=pico
