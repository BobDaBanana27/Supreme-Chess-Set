<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">74HC165 Shift Register Cascade & High-Speed Readout Timing</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 06 | Sensor Matrix</text>

  <!-- Top: 2x 74HC165 Strip Daisy-Chain Circuit Diagram -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="740" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="26" fill="#7ee787" font-size="14" font-weight="700">15-Slot Capture Tray Strip Architecture (PISO Cascade)</text>

    <!-- FFC Connector J1 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="80" height="120" rx="6" fill="#21262d" stroke="#58a6ff"/>
      <text x="40" y="24" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">J1: FFC In</text>
      <text x="10" y="50" fill="#3fb950" font-size="9">1: 3.3V</text>
      <text x="10" y="68" fill="#8b949e" font-size="9">2: GND</text>
      <text x="10" y="86" fill="#e3b341" font-size="9">3: /PL</text>
      <text x="10" y="104" fill="#e3b341" font-size="9">4: CP</text>
    </g>

    <!-- IC1: 74HC165 (Pawns 1-8) -->
    <g transform="translate(150, 50)">
      <rect x="0" y="0" width="220" height="120" rx="6" fill="#1f242d" stroke="#3fb950" stroke-width="1.5"/>
      <text x="110" y="24" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">IC1: 74HC165 (Pawns 1–8)</text>
      <text x="15" y="50" fill="#c9d1d9" font-size="10">Inputs D0..D7 &lt;-- Hall H1..H8</text>
      <text x="15" y="70" fill="#8b949e" font-size="9">PL: Parallel Load (Latch)</text>
      <text x="15" y="88" fill="#8b949e" font-size="9">CP: 1 MHz Clock Pulse</text>
      <text x="15" y="106" fill="#7ee787" font-size="9">Q7: Serial Data Out ------&gt;</text>
    </g>

    <!-- Daisy-chain line IC1 to IC2 -->
    <line x1="370" y1="150" x2="430" y2="150" stroke="#7ee787" stroke-width="2"/>
    <text x="400" y="142" fill="#7ee787" font-size="9" text-anchor="middle">DS (Serial)</text>

    <!-- IC2: 74HC165 (Knights, Bishops, Rooks, Queen) -->
    <g transform="translate(430, 50)">
      <rect x="0" y="0" width="280" height="120" rx="6" fill="#1f242d" stroke="#e3b341" stroke-width="1.5"/>
      <text x="140" y="24" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">IC2: 74HC165 (Major / Minor Pieces)</text>
      <text x="15" y="48" fill="#c9d1d9" font-size="10">D0,D1: Knights (+3) | D2,D3: Bishops (+3)</text>
      <text x="15" y="68" fill="#c9d1d9" font-size="10">D4,D5: Rooks (+5)   | D6: Queen (+9)</text>
      <text x="15" y="88" fill="#8b949e" font-size="9">D7: Reserved bit</text>
      <text x="15" y="106" fill="#58a6ff" font-size="9">Q7 Output ----&gt; Stream to MCU (GP12)</text>
    </g>
  </g>

  <!-- Bottom: Digital Readout Timing Waveforms -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="740" height="190" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="26" fill="#58a6ff" font-size="14" font-weight="700">Digital Timing Waveforms (1 MHz Strobe & Shift Protocol)</text>

    <!-- Waveform 1: /PL (Parallel Load) -->
    <g transform="translate(130, 40)">
      <text x="-110" y="20" fill="#e3b341" font-size="11" font-family="Courier, monospace">/PL (GP10)</text>
      <path d="M 0 0 L 40 0 L 40 25 L 80 25 L 80 0 L 580 0" fill="none" stroke="#e3b341" stroke-width="2"/>
      <text x="60" y="38" fill="#8b949e" font-size="9" text-anchor="middle">1.0µs latch</text>
    </g>

    <!-- Waveform 2: CP (Clock Pulse) -->
    <g transform="translate(130, 85)">
      <text x="-110" y="20" fill="#3fb950" font-size="11" font-family="Courier, monospace">CP (GP11)</text>
      <path d="M 0 25 L 100 25 
               L 100 0 L 120 0 L 120 25 
               L 140 25 L 140 0 L 160 0 L 160 25 
               L 180 25 L 180 0 L 200 0 L 200 25 
               L 220 25 L 220 0 L 240 0 L 240 25 
               L 260 25 L 260 0 L 280 0 L 280 25 
               L 300 25 L 300 0 L 320 0 L 320 25 
               L 340 25 L 340 0 L 360 0 L 360 25 
               L 380 25 L 380 0 L 400 0 L 400 25 
               L 420 25 L 420 0 L 440 0 L 440 25 
               L 460 25 L 460 0 L 480 0 L 480 25 
               L 580 25" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="300" y="38" fill="#8b949e" font-size="9" text-anchor="middle">32 Clocks @ 1 MHz (Total Scan: 32 µs)</text>
    </g>

    <!-- Waveform 3: Q7 (Serial Data Out) -->
    <g transform="translate(130, 130)">
      <text x="-110" y="20" fill="#79c0ff" font-size="11" font-family="Courier, monospace">DATA (GP12)</text>
      <path d="M 0 0 L 80 0 L 80 25 L 120 25 L 120 0 L 160 0 L 160 25 L 240 25 L 240 0 L 320 0 L 320 25 L 400 25 L 400 0 L 580 0" fill="none" stroke="#79c0ff" stroke-width="2"/>
      <text x="100" y="16" fill="#ffffff" font-size="8" text-anchor="middle">Q</text>
      <text x="140" y="16" fill="#ffffff" font-size="8" text-anchor="middle">R1</text>
      <text x="200" y="16" fill="#ffffff" font-size="8" text-anchor="middle">R2</text>
      <text x="280" y="16" fill="#ffffff" font-size="8" text-anchor="middle">B1..B2</text>
      <text x="360" y="16" fill="#ffffff" font-size="8" text-anchor="middle">N1..N2</text>
      <text x="440" y="16" fill="#ffffff" font-size="8" text-anchor="middle">P1..P8</text>
    </g>
  </g>
</svg>
