<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Firmware Shift Register Driver & Debounce Filter Architecture</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 13 | Firmware Driver</text>

  <!-- Flowchart Stages -->
  <g transform="translate(60, 90)">
    <!-- Stage 1: Timer Tick -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="100" y="26" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">50ms Periodic Tick</text>
    <text x="100" y="44" fill="#8b949e" font-size="10" text-anchor="middle">RP2040 Timer Interrupt</text>

    <line x1="200" y1="30" x2="250" y2="30" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Parallel Latch Strobe -->
    <rect x="250" y="0" width="220" height="60" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="360" y="26" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Strobe /PL (GP10)</text>
    <text x="360" y="44" fill="#8b949e" font-size="10" text-anchor="middle">Asynchronous 2µs Pulse LOW</text>

    <line x1="470" y1="30" x2="520" y2="30" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 3: Clock Out 32 Bits -->
    <rect x="520" y="0" width="200" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="620" y="26" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Bit-Bang 32 Clocks</text>
    <text x="620" y="44" fill="#8b949e" font-size="10" text-anchor="middle">Read GP12 (32µs total)</text>
  </g>

  <!-- Flow down to Debounce Filter -->
  <line x1="680" y1="150" x2="680" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(60, 200)">
    <!-- Stage 4: Invert Active-Low Bits -->
    <rect x="460" y="0" width="260" height="70" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="590" y="26" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">Bitfield Inversion (~raw_bits)</text>
    <text x="590" y="44" fill="#c9d1d9" font-size="10" text-anchor="middle">Hall Switch: LOW when magnet seated</text>
    <text x="590" y="58" fill="#8b949e" font-size="9" text-anchor="middle">1 = Piece Present, 0 = Empty Socket</text>

    <line x1="460" y1="35" x2="400" y2="35" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 5: 3-Sample Temporal Filter -->
    <rect x="140" y="0" width="260" height="70" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="270" y="26" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">3-Sample Debounce Ring</text>
    <text x="270" y="44" fill="#c9d1d9" font-size="10" text-anchor="middle">history[0] &amp; history[1] &amp; history[2]</text>
    <text x="270" y="58" fill="#8b949e" font-size="9" text-anchor="middle">Rejects accidental hand brushing</text>

    <line x1="140" y1="35" x2="80" y2="35" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 6: State Changed Decision -->
    <polygon points="40,0 80,35 40,70 0,35" fill="#1f242d" stroke="#e3b341" stroke-width="1.5"/>
    <text x="40" y="38" fill="#e3b341" font-size="9" font-weight="bold" text-anchor="middle">Changed?</text>
  </g>

  <!-- Branching from decision -->
  <g transform="translate(60, 310)">
    <!-- Branch YES: Recalculate and update UI -->
    <rect x="0" y="30" width="320" height="90" rx="8" fill="#1f3d2b" stroke="#238636" stroke-width="2"/>
    <text x="160" y="54" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">YES: Dispatch Score Event</text>
    <text x="160" y="74" fill="#c9d1d9" font-size="10" text-anchor="middle">• Update White &amp; Black point tallies</text>
    <text x="160" y="90" fill="#c9d1d9" font-size="10" text-anchor="middle">• Recompute material advantage bar</text>
    <text x="160" y="106" fill="#7ee787" font-size="9" text-anchor="middle">• Trigger 30 FPS OLED partial refresh</text>

    <!-- Branch NO: Increment sleep counter -->
    <rect x="400" y="30" width="280" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="540" y="54" fill="#8b949e" font-size="13" font-weight="bold" text-anchor="middle">NO: Idle Energy Conservation</text>
    <text x="540" y="74" fill="#6e7681" font-size="10" text-anchor="middle">• Increment inactivity timer</text>
    <text x="540" y="90" fill="#6e7681" font-size="10" text-anchor="middle">• Maintain current display state</text>
    <text x="540" y="106" fill="#6e7681" font-size="9" text-anchor="middle">• Dim OLED after 5 minutes of no moves</text>
  </g>
</svg>
