<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="sqLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d9b5"/>
      <stop offset="100%" stop-color="#d6b88a"/>
    </linearGradient>
    <linearGradient id="sqDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b58863"/>
      <stop offset="100%" stop-color="#8b5e3c"/>
    </linearGradient>
    <linearGradient id="drawerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Supreme Chess Set — System Concept & Architecture Scope</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 01 | Requirements</text>

  <!-- Main Playing Board Enclosure -->
  <g transform="translate(40, 80)">
    <!-- Enclosure Base Frame -->
    <rect x="0" y="0" width="420" height="380" rx="16" fill="url(#boardGrad)" stroke="#388bfd" stroke-width="2"/>
    <text x="20" y="28" fill="#c9d1d9" font-size="14" font-weight="700">Folding Magnetic Board (160×160mm Core)</text>
    <text x="20" y="44" fill="#8b949e" font-size="11">Embedded 5x2mm N35 Neodymium Magnets Beneath Every Square</text>

    <!-- Chess Board Grid 8x8 Mini-View -->
    <g transform="translate(70, 60)">
      <rect x="-4" y="-4" width="288" height="288" rx="6" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
      <!-- Repeat 8x8 squares -->
      <g>
        <!-- Row 0 -->
        <rect x="0" y="0" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="35" y="0" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="70" y="0" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="105" y="0" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="140" y="0" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="175" y="0" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="210" y="0" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="245" y="0" width="35" height="35" fill="url(#sqDark)"/>
        <!-- Row 1 -->
        <rect x="0" y="35" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="35" y="35" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="70" y="35" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="105" y="35" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="140" y="35" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="175" y="35" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="210" y="35" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="245" y="35" width="35" height="35" fill="url(#sqLight)"/>
        <!-- Row 2-5 placeholder -->
        <rect x="0" y="70" width="280" height="140" fill="#21262d" opacity="0.4"/>
        <text x="75" y="145" fill="#8b949e" font-size="13" font-weight="600">64 Magnetic Squares</text>
        <!-- Row 6 -->
        <rect x="0" y="210" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="35" y="210" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="70" y="210" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="105" y="210" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="140" y="210" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="175" y="210" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="210" y="210" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="245" y="210" width="35" height="35" fill="url(#sqDark)"/>
        <!-- Row 7 -->
        <rect x="0" y="245" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="35" y="245" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="70" y="245" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="105" y="245" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="140" y="245" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="175" y="245" width="35" height="35" fill="url(#sqLight)"/>
        <rect x="210" y="245" width="35" height="35" fill="url(#sqDark)"/>
        <rect x="245" y="245" width="35" height="35" fill="url(#sqLight)"/>
      </g>
    </g>
  </g>

  <!-- Right Side: Capture Tray & Live Display Integration -->
  <g transform="translate(480, 80)">
    <!-- Enclosure for Capture Rails -->
    <rect x="0" y="0" width="280" height="380" rx="16" fill="url(#drawerGrad)" stroke="#238636" stroke-width="2"/>
    <text x="18" y="26" fill="#7ee787" font-size="14" font-weight="700">Slide-Out Capture Tray & Counter</text>
    <text x="18" y="42" fill="#8b949e" font-size="11">Dedicated Molded Sensor Slots (15 Per Tray)</text>

    <!-- Molded Piece Slots Visualization -->
    <g transform="translate(18, 55)">
      <!-- Queen Slot -->
      <rect x="0" y="0" width="70" height="42" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
      <circle cx="20" cy="21" r="12" fill="#d29922" opacity="0.3"/>
      <text x="20" y="25" fill="#f0e6d2" font-size="12" font-weight="bold" text-anchor="middle">♛</text>
      <text x="38" y="18" fill="#e3b341" font-size="10" font-weight="bold">QUEEN</text>
      <text x="38" y="32" fill="#8b949e" font-size="9">+9 pts</text>

      <!-- Rook Slots -->
      <rect x="80" y="0" width="70" height="42" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
      <text x="20" y="25" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="38" y="18" fill="#58a6ff" font-size="10" font-weight="bold">ROOK 1</text>
      <text x="38" y="32" fill="#8b949e" font-size="9">+5 pts</text>

      <rect x="160" y="0" width="70" height="42" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
      <text x="20" y="25" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="38" y="18" fill="#58a6ff" font-size="10" font-weight="bold">ROOK 2</text>
      <text x="38" y="32" fill="#8b949e" font-size="9">+5 pts</text>

      <!-- Bishops & Knights -->
      <rect x="0" y="50" width="55" height="38" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="24" fill="#a371f7" font-size="12" text-anchor="middle">♝</text>
      <text x="36" y="22" fill="#8b949e" font-size="9">B1 (+3)</text>

      <rect x="62" y="50" width="55" height="38" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="24" fill="#a371f7" font-size="12" text-anchor="middle">♝</text>
      <text x="36" y="22" fill="#8b949e" font-size="9">B2 (+3)</text>

      <rect x="124" y="50" width="55" height="38" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="24" fill="#3fb950" font-size="12" text-anchor="middle">♞</text>
      <text x="36" y="22" fill="#8b949e" font-size="9">N1 (+3)</text>

      <rect x="186" y="50" width="55" height="38" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="24" fill="#3fb950" font-size="12" text-anchor="middle">♞</text>
      <text x="36" y="22" fill="#8b949e" font-size="9">N2 (+3)</text>

      <!-- 8 Pawn Slots Array -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="242" height="38" rx="6" fill="#0f141c" stroke="#30363d"/>
        <text x="10" y="16" fill="#8b949e" font-size="9" font-weight="600">PAWNS (8 Sockets × 1 pt = 8 pts max)</text>
        <circle cx="20" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="50" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="80" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="110" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="140" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="170" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="200" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
        <circle cx="230" cy="28" r="6" fill="#21262d" stroke="#58a6ff"/>
      </g>
    </g>

    <!-- Sub-board: OLED Live Point Display Mockup -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="240" height="95" rx="8" fill="url(#oledGrad)" stroke="#1f6feb" stroke-width="2"/>
      <text x="12" y="20" fill="#58a6ff" font-size="10" font-family="Courier, monospace">0.96" SSD1306 OLED (I2C)</text>
      
      <!-- Live Game Screen Content -->
      <text x="12" y="45" fill="#ffffff" font-size="16" font-family="Courier, monospace" font-weight="bold">WHITE: 14</text>
      <text x="130" y="45" fill="#ffffff" font-size="16" font-family="Courier, monospace" font-weight="bold">BLACK: 11</text>
      
      <!-- Material Lead Bar -->
      <rect x="12" y="55" width="216" height="12" rx="3" fill="#21262d"/>
      <rect x="12" y="55" width="138" height="12" rx="3" fill="#3fb950"/>
      <text x="120" y="65" fill="#0d1117" font-size="9" font-weight="bold" text-anchor="middle">W LEAD +3</text>

      <text x="12" y="84" fill="#7ee787" font-size="11" font-family="Courier, monospace">CLOCK: 04:32 | CAPT: Q,N,P</text>
    </g>

    <!-- Specs callout -->
    <g transform="translate(20, 325)">
      <rect x="0" y="0" width="240" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="10" y="16" fill="#f0883e" font-size="10" font-weight="bold">BOM BUDGET: $26.85 / $30.00 LIMIT</text>
      <text x="10" y="32" fill="#8b949e" font-size="10">Hall Effect Sensors • RP2040 MCU • LiPo USB-C</text>
    </g>
  </g>
</svg>
