<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Engineering Trade Study & Budget Optimization</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 02 | Trade & BOM</text>

  <!-- Left: Sensor Selection Scoring Matrix -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="370" height="390" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="30" fill="#7ee787" font-size="15" font-weight="700">Sensor Technology Evaluation</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">Comparative weighted analysis for 30 piece capture slots</text>

    <!-- Table Header -->
    <rect x="15" y="65" width="340" height="28" fill="#21262d" rx="4"/>
    <text x="25" y="83" fill="#c9d1d9" font-size="11" font-weight="bold">Technology</text>
    <text x="160" y="83" fill="#c9d1d9" font-size="11" font-weight="bold">Cost (30x)</text>
    <text x="250" y="83" fill="#c9d1d9" font-size="11" font-weight="bold">Reliability</text>
    <text x="320" y="83" fill="#c9d1d9" font-size="11" font-weight="bold">Score</text>

    <!-- Row 1: Hall Effect (Winner) -->
    <rect x="15" y="100" width="340" height="48" fill="#1f3d2b" stroke="#238636" stroke-width="1.5" rx="4"/>
    <text x="25" y="122" fill="#3fb950" font-size="12" font-weight="bold">Digital Hall (AH49E)</text>
    <text x="25" y="137" fill="#7ee787" font-size="10">Solid-state / magnet base</text>
    <text x="160" y="128" fill="#c9d1d9" font-size="11">$3.30</text>
    <text x="250" y="128" fill="#3fb950" font-size="11">10/10</text>
    <text x="320" y="128" fill="#3fb950" font-size="13" font-weight="bold">9.45 ★</text>

    <!-- Row 2: Reed Switch -->
    <rect x="15" y="155" width="340" height="42" fill="#1c2128" rx="4"/>
    <text x="25" y="174" fill="#c9d1d9" font-size="11" font-weight="bold">Glass Reed Switch</text>
    <text x="25" y="188" fill="#8b949e" font-size="9">Fragile glass envelope</text>
    <text x="160" y="180" fill="#c9d1d9" font-size="11">$4.50</text>
    <text x="250" y="180" fill="#e3b341" font-size="11">6/10</text>
    <text x="320" y="180" fill="#c9d1d9" font-size="11">7.40</text>

    <!-- Row 3: Miniature Microswitch -->
    <rect x="15" y="204" width="340" height="42" fill="#1c2128" rx="4"/>
    <text x="25" y="223" fill="#c9d1d9" font-size="11" font-weight="bold">Mechanical Microswitch</text>
    <text x="25" y="237" fill="#8b949e" font-size="9">Bulky, mechanical wear</text>
    <text x="160" y="229" fill="#c9d1d9" font-size="11">$6.00</text>
    <text x="250" y="229" fill="#f85149" font-size="11">6/10</text>
    <text x="320" y="229" fill="#c9d1d9" font-size="11">5.75</text>

    <!-- Row 4: Optical IR Reflective -->
    <rect x="15" y="253" width="340" height="42" fill="#1c2128" rx="4"/>
    <text x="25" y="272" fill="#c9d1d9" font-size="11" font-weight="bold">IR Optical (TCRT5000)</text>
    <text x="25" y="286" fill="#8b949e" font-size="9">High power draw, dust prone</text>
    <text x="160" y="278" fill="#c9d1d9" font-size="11">$7.50</text>
    <text x="250" y="278" fill="#f85149" font-size="11">5/10</text>
    <text x="320" y="278" fill="#c9d1d9" font-size="11">5.60</text>

    <!-- Row 5: RFID / NFC -->
    <rect x="15" y="302" width="340" height="42" fill="#1c2128" rx="4"/>
    <text x="25" y="321" fill="#c9d1d9" font-size="11" font-weight="bold">RFID / NFC Antennas</text>
    <text x="25" y="335" fill="#8b949e" font-size="9">Exceeds $30 limit entirely</text>
    <text x="160" y="327" fill="#f85149" font-size="11">> $45</text>
    <text x="250" y="327" fill="#8b949e" font-size="11">9/10</text>
    <text x="320" y="327" fill="#f85149" font-size="11">2.95</text>

    <text x="25" y="370" fill="#58a6ff" font-size="11" font-weight="bold">Decision: Digital Hall ICs leverage existing board magnets.</text>
  </g>

  <!-- Right: BOM Cost Breakdown vs $30 Target -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="390" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="30" fill="#58a6ff" font-size="15" font-weight="700">Sub-$30 Budget Allocation</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">Actual Prototype Cost: $26.85 (Buffer: $3.15 / 10.5%)</text>

    <!-- Visual Budget Bar -->
    <g transform="translate(20, 65)">
      <!-- Background $30 total track -->
      <rect x="0" y="0" width="310" height="24" rx="4" fill="#21262d"/>
      <!-- Sourced parts fill ($26.85 / 30 = 89.5% = 277px) -->
      <rect x="0" y="0" width="277" height="24" rx="4" fill="#238636"/>
      <line x1="277" y1="-4" x2="277" y2="28" stroke="#f0883e" stroke-width="2" stroke-dasharray="2,2"/>
      <text x="138" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">UTILIZED: $26.85 (89.5%)</text>
      <text x="294" y="16" fill="#3fb950" font-size="10" font-weight="bold">$3.15</text>
    </g>

    <!-- Cost Breakdown Donut / Stacked Bars -->
    <g transform="translate(20, 110)">
      <!-- Item 1: Microcontroller & Display -->
      <rect x="0" y="0" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#58a6ff"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">MCU & OLED Display</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">RP2040-Zero ($4.20) + SSD1306 ($2.20)</text>
      <text x="260" y="21" fill="#58a6ff" font-size="12" font-weight="bold">$6.40</text>

      <!-- Item 2: Sensor Array & Shift Registers -->
      <rect x="0" y="42" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#3fb950"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">Sensors & Multiplexers</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">30x Hall ICs ($3.30) + 4x 74HC165 ($1.12)</text>
      <text x="260" y="21" fill="#3fb950" font-size="12" font-weight="bold">$4.42</text>

      <!-- Item 3: Magnets & Fasteners -->
      <rect x="0" y="84" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#e3b341"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">Magnets & Mechanics</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">96x N35 Neodymium Magnets ($3.36)</text>
      <text x="260" y="21" fill="#e3b341" font-size="12" font-weight="bold">$3.36</text>

      <!-- Item 4: LiPo Battery & USB-C Charger -->
      <rect x="0" y="126" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#a371f7"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">Power Subsystem</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">500mAh LiPo ($3.60) + TP4056 Charger ($0.65)</text>
      <text x="260" y="21" fill="#a371f7" font-size="12" font-weight="bold">$4.25</text>

      <!-- Item 5: Custom 2-Layer PCB -->
      <rect x="0" y="168" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#f0883e"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">Custom Sensor Carrier PCBs</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">Dual strip boards (JLCPCB batch tier)</text>
      <text x="260" y="21" fill="#f0883e" font-size="12" font-weight="bold">$2.00</text>

      <!-- Item 6: Filament & Misc Hardware -->
      <rect x="0" y="210" width="310" height="34" rx="4" fill="#1c2128"/>
      <circle cx="15" cy="17" r="6" fill="#79c0ff"/>
      <text x="30" y="16" fill="#c9d1d9" font-size="11" font-weight="bold">3D Filament & Fasteners</text>
      <text x="30" y="28" fill="#8b949e" font-size="9">220g PLA+ ($3.96) + Screws/Heatsets ($2.46)</text>
      <text x="260" y="21" fill="#79c0ff" font-size="12" font-weight="bold">$6.42</text>
    </g>
  </g>
</svg>
