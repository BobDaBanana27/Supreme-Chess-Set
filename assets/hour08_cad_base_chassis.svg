<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Mechanical Base Chassis Architecture (FreeCAD 1.1 Model)</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 08 | CAD Chassis</text>

  <!-- Left: Top Orthographic View -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="420" height="230" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="20" y="24" fill="#58a6ff" font-size="13" font-weight="bold">Top View: Base Enclosure Half (168 × 92 mm)</text>

    <!-- Playing Board Inset Cavity (160 x 80 mm) -->
    <rect x="10" y="35" width="400" height="180" rx="4" fill="#0d1117" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="210" y="125" fill="#388bfd" font-size="12" font-weight="bold" text-anchor="middle">Board Insert Pocket (160.0 × 80.0 × 4.0 mm)</text>

    <!-- Drawer Cavity Hidden Line -->
    <rect x="15" y="45" width="390" height="160" rx="4" fill="none" stroke="#238636" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="210" y="145" fill="#7ee787" font-size="10" text-anchor="middle">Internal Slide-Way for Capture Drawer (158 × 84 mm)</text>

    <!-- USB-C Port Cutout -->
    <rect x="195" y="0" width="30" height="10" rx="2" fill="#e3b341"/>
    <text x="210" y="22" fill="#e3b341" font-size="8" text-anchor="middle">USB-C</text>

    <!-- Hinge Knuckles at Bottom Edge -->
    <rect x="40" y="220" width="30" height="18" rx="4" fill="#30363d" stroke="#58a6ff"/>
    <circle cx="55" cy="229" r="3" fill="#ffffff"/>

    <rect x="350" y="220" width="30" height="18" rx="4" fill="#30363d" stroke="#58a6ff"/>
    <circle cx="365" cy="229" r="3" fill="#ffffff"/>
    <text x="210" y="235" fill="#8b949e" font-size="10" text-anchor="middle">Dual Pivot Hinge Knuckles (Ø3.0mm Pin Axis)</text>

    <!-- Corner Magnetic Latches -->
    <circle cx="25" cy="20" r="5" fill="#d73a49" stroke="#ffffff"/>
    <circle cx="395" cy="20" r="5" fill="#d73a49" stroke="#ffffff"/>
    <text x="45" y="23" fill="#8b949e" font-size="9">Ø5.2mm Mag Latch</text>
  </g>

  <!-- Right: Isometric / Cross-Sectional Details -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="290" height="390" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="18" y="26" fill="#7ee787" font-size="13" font-weight="bold">Mechanical Specifications</text>
    <text x="18" y="44" fill="#8b949e" font-size="11">Editable CAD: .FCStd and .step generated</text>

    <!-- Cross Section Slice Graphic -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="250" height="100" rx="4" fill="#0d1117" stroke="#484f58"/>
      <!-- Wall thickness -->
      <path d="M 0 0 L 250 0 L 250 100 L 0 100 Z 
               M 12 12 L 12 40 L 238 40 L 238 12 Z 
               M 12 52 L 12 88 L 238 88 L 238 52 Z" fill="#21262d" fill-rule="evenodd"/>
      <text x="125" y="30" fill="#58a6ff" font-size="10" text-anchor="middle">Board Pocket (Depth: 4.0mm)</text>
      <text x="125" y="74" fill="#3fb950" font-size="10" text-anchor="middle">Drawer Slide Track (Depth: 7.5mm)</text>
      <text x="125" y="96" fill="#8b949e" font-size="8" text-anchor="middle">Solid Base Floor (Thickness: 2.5mm)</text>
    </g>

    <!-- Callouts list -->
    <g transform="translate(20, 180)">
      <text x="0" y="20" fill="#c9d1d9" font-size="11" font-weight="bold">CAD Source Deliverables:</text>
      <text x="0" y="40" fill="#58a6ff" font-size="10">• cad/supreme_chess_base.FCStd</text>
      <text x="0" y="58" fill="#58a6ff" font-size="10">• cad/supreme_chess_base.step</text>

      <text x="0" y="90" fill="#c9d1d9" font-size="11" font-weight="bold">Tolerances & Clearances:</text>
      <text x="0" y="110" fill="#8b949e" font-size="10">• Drawer clearance gap: 0.35 mm</text>
      <text x="0" y="128" fill="#8b949e" font-size="10">• Magnet press-fit interference: +0.10 mm</text>
      <text x="0" y="146" fill="#8b949e" font-size="10">• Hinge pin clearance: 0.20 mm</text>

      <text x="0" y="180" fill="#3fb950" font-size="11" font-weight="bold">✓ 100% Print-in-place / Zero Supports</text>
    </g>
  </g>

  <!-- Bottom Left: Front Elevation View -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="420" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="24" fill="#c9d1d9" font-size="12" font-weight="bold">Front Elevation View (Height: 15.0 mm)</text>
    <!-- 15mm elevation profile -->
    <rect x="20" y="45" width="380" height="45" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="60" y="55" width="300" height="25" rx="2" fill="#0d1117" stroke="#3fb950"/>
    <text x="210" y="71" fill="#3fb950" font-size="10" text-anchor="middle">Capture Tray Egress Opening (158 × 7.5 mm)</text>
    <text x="210" y="115" fill="#8b949e" font-size="10" text-anchor="middle">Rigid 2.4 mm Perimeter Wall Absorbs Drop Shocks</text>
  </g>
</svg>
