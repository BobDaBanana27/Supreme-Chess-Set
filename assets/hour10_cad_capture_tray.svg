<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Smart Capture Tray & Dedicated Molded Socket CAD</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 10 | CAD Tray</text>

  <!-- Left: Top Orthographic View of Capture Drawer -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="460" height="260" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="20" y="24" fill="#7ee787" font-size="13" font-weight="bold">Slide-Out Capture Tray Deck (156.0 × 82.0 mm)</text>

    <!-- Front Pull Tab -->
    <rect x="-12" y="90" width="12" height="70" rx="4" fill="#2ea043" stroke="#238636"/>
    <text x="-6" y="128" fill="#ffffff" font-size="8" text-anchor="middle" transform="rotate(-90 -6 128)">PULL</text>

    <!-- Row 1: 8 Pawns (18mm pitch) -->
    <g transform="translate(30, 50)">
      <text x="0" y="-8" fill="#8b949e" font-size="10" font-weight="bold">ROW 1: PAWNS (8× Sockets • +1 pt each)</text>
      <!-- 8 pawn circles -->
      <g>
        <circle cx="20" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="20" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="68" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="68" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="116" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="116" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="164" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="164" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="212" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="212" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="260" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="260" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="308" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="308" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

        <circle cx="356" cy="20" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="356" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>
      </g>
    </g>

    <!-- Row 2: Major & Minor Pieces + King -->
    <g transform="translate(15, 130)">
      <text x="0" y="-8" fill="#8b949e" font-size="10" font-weight="bold">ROW 2: ROYAL COURT &amp; MAJORS (♔ 0pts, ♛ 9pts, ♜ 5pts, ♝ 3pts, ♞ 3pts)</text>
      <!-- King -->
      <circle cx="20" cy="30" r="18" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
      <text x="20" y="35" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">♔</text>
      <text x="20" y="62" fill="#f85149" font-size="9" text-anchor="middle">K (0p)</text>

      <!-- Queen -->
      <circle cx="70" cy="30" r="18" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
      <text x="70" y="35" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">♛</text>
      <text x="70" y="62" fill="#e3b341" font-size="9" text-anchor="middle">Q (+9)</text>

      <!-- Rooks -->
      <circle cx="120" cy="30" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="120" y="35" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="120" y="60" fill="#8b949e" font-size="8" text-anchor="middle">R1 (+5)</text>

      <circle cx="170" cy="30" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="170" y="35" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="170" y="60" fill="#8b949e" font-size="8" text-anchor="middle">R2 (+5)</text>

      <!-- Bishops -->
      <circle cx="220" cy="30" r="15" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
      <text x="220" y="35" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">♝</text>
      <text x="220" y="60" fill="#8b949e" font-size="8" text-anchor="middle">B1 (+3)</text>

      <circle cx="270" cy="30" r="15" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
      <text x="270" y="35" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">♝</text>
      <text x="270" y="60" fill="#8b949e" font-size="8" text-anchor="middle">B2 (+3)</text>

      <!-- Knights -->
      <circle cx="320" cy="30" r="15" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="320" y="35" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">♞</text>
      <text x="320" y="60" fill="#8b949e" font-size="8" text-anchor="middle">N1 (+3)</text>

      <circle cx="370" cy="30" r="15" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="370" y="35" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">♞</text>
      <text x="370" y="60" fill="#8b949e" font-size="8" text-anchor="middle">N2 (+3)</text>
    </g>

    <!-- Side Guide Rails Callout -->
    <line x1="0" y1="2" x2="460" y2="2" stroke="#58a6ff" stroke-width="3"/>
    <line x1="0" y1="258" x2="460" y2="258" stroke="#58a6ff" stroke-width="3"/>
  </g>

  <!-- Right: PCB Cavity & Alignment -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="260" height="390" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="18" y="26" fill="#e3b341" font-size="13" font-weight="bold">Under-Tray Integration</text>
    <text x="18" y="44" fill="#8b949e" font-size="11">Sensor PCB Snaps Directly Underneath</text>

    <!-- Cross Section Slice Graphic -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="220" height="110" rx="4" fill="#0d1117" stroke="#484f58"/>
      <!-- Molded Pocket -->
      <path d="M 30 10 L 50 10 L 50 50 L 170 50 L 170 10 L 190 10 L 190 90 L 30 90 Z" fill="#21262d"/>
      <text x="110" y="35" fill="#58a6ff" font-size="10" text-anchor="middle">Molded Piece Pocket (Depth 4.8mm)</text>

      <!-- 0.8mm thin floor membrane -->
      <rect x="50" y="50" width="120" height="8" fill="#e3b341"/>
      <text x="110" y="56" fill="#000000" font-size="6" font-weight="bold" text-anchor="middle">0.8mm Wall</text>

      <!-- Underlying Sensor PCB cavity -->
      <rect x="40" y="62" width="140" height="20" fill="#0e4429" stroke="#238636"/>
      <text x="110" y="75" fill="#7ee787" font-size="8" text-anchor="middle">Sensor Strip PCB + SOT-23 Hall</text>
    </g>

    <!-- Operational Benefits -->
    <g transform="translate(20, 195)">
      <text x="0" y="20" fill="#c9d1d9" font-size="11" font-weight="bold">Why Dedicated Sockets Win:</text>
      <text x="0" y="40" fill="#7ee787" font-size="10">✓ Zero CV / Machine Learning lag</text>
      <text x="0" y="58" fill="#7ee787" font-size="10">✓ Zero complex RFID tag circuits</text>
      <text x="0" y="76" fill="#7ee787" font-size="10">✓ Solid-state magnetic detection</text>
      <text x="0" y="94" fill="#7ee787" font-size="10">✓ Instant score update (&lt; 50 ms)</text>

      <text x="0" y="130" fill="#c9d1d9" font-size="11" font-weight="bold">Delivered Files:</text>
      <text x="0" y="150" fill="#58a6ff" font-size="10">• cad/capture_tray.FCStd</text>
      <text x="0" y="168" fill="#58a6ff" font-size="10">• cad/capture_tray.step</text>
    </g>
  </g>

  <!-- Bottom Left: Slide Mechanics -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="460" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="24" fill="#c9d1d9" font-size="12" font-weight="bold">Dual Slide-Out Symmetry</text>
    <text x="20" y="46" fill="#8b949e" font-size="10">• White player pulls out Tray 1 on player right; Black pulls out Tray 2 on opposite side</text>
    <text x="20" y="66" fill="#8b949e" font-size="10">• Pieces store securely in molded wells when folded for travel—never rattle or scatter</text>
    <text x="20" y="86" fill="#7ee787" font-size="10">✓ Friction detent holds tray locked during transport and extended during play</text>
  </g>
</svg>
