<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Precision Symmetrical Capture Tray &amp; Molded Socket Matrix</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 10 | CAD Tray</text>

  <!-- Left: Top Orthographic View of Capture Drawer -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="460" height="260" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="20" y="24" fill="#7ee787" font-size="13" font-weight="bold">Slide-Out Capture Tray Deck (156.0 × 82.0 mm) — 100% Even 8×2 Matrix</text>

    <!-- Front Pull Tab -->
    <rect x="-12" y="90" width="12" height="80" rx="4" fill="#2ea043" stroke="#238636"/>
    <text x="-6" y="134" fill="#ffffff" font-size="8" text-anchor="middle" transform="rotate(-90 -6 134)">PULL</text>

    <!-- Row 1: 8 Pawns (Even 18mm pitch, centered) -->
    <g transform="translate(15, 50)">
      <text x="10" y="-8" fill="#8b949e" font-size="10" font-weight="bold">ROW 1: PAWNS (8× Sockets • 18.0 mm Uniform Pitch • +1 pt each)</text>
      <circle cx="30" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="30" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="80" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="80" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="130" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="130" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="180" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="180" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="230" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="230" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="280" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="280" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="330" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="330" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>

      <circle cx="380" cy="20" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="380" y="24" fill="#58a6ff" font-size="11" text-anchor="middle">♟</text>
    </g>

    <!-- Row 2: Royal Court & Majors Ordered by Hierarchy & Size (King, Queen, Rooks, Knights, Bishops) -->
    <g transform="translate(15, 130)">
      <text x="10" y="-8" fill="#8b949e" font-size="10" font-weight="bold">ROW 2: ROYALS &amp; MAJORS (King, Queen, Rooks, Knights, Bishops)</text>

      <!-- Col 0: King (Largest Ø15.5mm) -->
      <circle cx="30" cy="30" r="17" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
      <text x="30" y="35" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">♔</text>
      <text x="30" y="62" fill="#f85149" font-size="9" text-anchor="middle">K (0p)</text>

      <!-- Col 1: Queen (Largest Ø15.5mm) -->
      <circle cx="80" cy="30" r="17" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
      <text x="80" y="35" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">♛</text>
      <text x="80" y="62" fill="#e3b341" font-size="9" text-anchor="middle">Q (+9)</text>

      <!-- Col 2: Rook 1 (Ø14.0mm) -->
      <circle cx="130" cy="30" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="130" y="35" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="130" y="60" fill="#8b949e" font-size="8" text-anchor="middle">R1 (+5)</text>

      <!-- Col 3: Rook 2 (Ø14.0mm) -->
      <circle cx="180" cy="30" r="15" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="180" y="35" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">♜</text>
      <text x="180" y="60" fill="#8b949e" font-size="8" text-anchor="middle">R2 (+5)</text>

      <!-- Col 4: Knight 1 (Ø14.0mm) -->
      <circle cx="230" cy="30" r="15" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="230" y="35" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">♞</text>
      <text x="230" y="60" fill="#8b949e" font-size="8" text-anchor="middle">N1 (+3)</text>

      <!-- Col 5: Knight 2 (Ø14.0mm) -->
      <circle cx="280" cy="30" r="15" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="280" y="35" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">♞</text>
      <text x="280" y="60" fill="#8b949e" font-size="8" text-anchor="middle">N2 (+3)</text>

      <!-- Col 6: Bishop 1 (Ø14.0mm) -->
      <circle cx="330" cy="30" r="15" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
      <text x="330" y="35" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">♝</text>
      <text x="330" y="60" fill="#8b949e" font-size="8" text-anchor="middle">B1 (+3)</text>

      <!-- Col 7: Bishop 2 (Ø14.0mm) -->
      <circle cx="380" cy="30" r="15" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
      <text x="380" y="35" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">♝</text>
      <text x="380" y="60" fill="#8b949e" font-size="8" text-anchor="middle">B2 (+3)</text>
    </g>

    <!-- Side Guide Rails Callout -->
    <line x1="0" y1="2" x2="460" y2="2" stroke="#58a6ff" stroke-width="3"/>
    <line x1="0" y1="258" x2="460" y2="258" stroke="#58a6ff" stroke-width="3"/>
  </g>

  <!-- Right: PCB Cavity & Alignment -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="260" height="390" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="18" y="26" fill="#e3b341" font-size="13" font-weight="bold">Under-Tray Integration</text>
    <text x="18" y="44" fill="#8b949e" font-size="11">Sensor PCB Snaps Directly Underneath</text>

    <!-- Cross Section Slice Graphic -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="220" height="150" fill="#0d1117" stroke="#484f58" rx="4"/>
      <text x="10" y="20" fill="#c9d1d9" font-size="10" font-weight="bold">Cross Section View (Socket)</text>

      <!-- Socket Wall Profile -->
      <path d="M 20 35 L 50 35 L 50 85 L 170 85 L 170 35 L 200 35 L 200 110 L 20 110 Z" fill="#21262d" stroke="#8b949e"/>

      <!-- Thin Membrane Floor (0.8mm) -->
      <rect x="50" y="85" width="120" height="8" fill="#3fb950"/>
      <text x="110" y="92" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">0.8 mm Membrane</text>

      <!-- Magnet in Piece Base -->
      <rect x="75" y="60" width="70" height="24" rx="2" fill="#f0883e" stroke="#ffffff"/>
      <text x="110" y="76" fill="#000000" font-size="9" font-weight="bold" text-anchor="middle">N35 Magnet</text>

      <!-- Sensor Strip PCB Below -->
      <rect x="40" y="115" width="140" height="12" rx="2" fill="#238636" stroke="#2ea043"/>
      <text x="110" y="124" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Sensor Strip PCB</text>

      <!-- Hall IC -->
      <rect x="95" y="103" width="30" height="10" fill="#58a6ff"/>
      <text x="110" y="111" fill="#ffffff" font-size="7" text-anchor="middle">Hall IC</text>
    </g>

    <!-- Specs Callouts -->
    <g transform="translate(20, 230)">
      <text x="0" y="20" fill="#7ee787" font-size="11" font-weight="bold">• 100% Even 18.0 mm Spacing</text>
      <text x="0" y="38" fill="#c9d1d9" font-size="10">• Both White &amp; Black trays identical</text>
      <text x="0" y="56" fill="#c9d1d9" font-size="10">• 8 Pawns directly align with 8 Majors</text>
      <text x="0" y="74" fill="#c9d1d9" font-size="10">• Equal 15.0 mm side margins</text>
      <text x="0" y="92" fill="#c9d1d9" font-size="10">• 0.8 mm membrane for high Hall flux</text>
      <text x="0" y="110" fill="#c9d1d9" font-size="10">• Fits all 32 pieces for travel storage</text>
    </g>
  </g>
</svg>
