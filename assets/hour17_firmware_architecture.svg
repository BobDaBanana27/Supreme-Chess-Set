<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Integrated Firmware Multi-Module Pipeline (RP2040)</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 17 | Firmware Complete</text>

  <!-- Central Superloop Box -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="280" height="380" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="140" y="28" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Main Executive Loop (main.cpp)</text>
    <text x="140" y="46" fill="#8b949e" font-size="10" text-anchor="middle">Arduino / PlatformIO RP2040 Core</text>

    <!-- Task 1: 50ms Scan -->
    <rect x="20" y="65" width="240" height="60" rx="6" fill="#1c2128" stroke="#3fb950"/>
    <text x="30" y="88" fill="#3fb950" font-size="11" font-weight="bold">1. 50ms Sensor Scan Tick</text>
    <text x="30" y="106" fill="#8b949e" font-size="9">Latches shift registers &amp; filters debounce</text>

    <!-- Task 2: Score Calculation -->
    <rect x="20" y="135" width="240" height="60" rx="6" fill="#1c2128" stroke="#e3b341"/>
    <text x="30" y="158" fill="#e3b341" font-size="11" font-weight="bold">2. Chess Scoring Engine</text>
    <text x="30" y="176" fill="#8b949e" font-size="9">FIDE weights: Q=9, R=5, B=3, N=3, P=1</text>

    <!-- Task 3: Display Render -->
    <rect x="20" y="205" width="240" height="60" rx="6" fill="#1c2128" stroke="#388bfd"/>
    <text x="30" y="228" fill="#58a6ff" font-size="11" font-weight="bold">3. SSD1306 Display Engine</text>
    <text x="30" y="246" fill="#8b949e" font-size="9">Dynamic balance bar &amp; piece tallies</text>

    <!-- Task 4: Power & Sleep Monitor -->
    <rect x="20" y="275" width="240" height="60" rx="6" fill="#1c2128" stroke="#a371f7"/>
    <text x="30" y="298" fill="#a371f7" font-size="11" font-weight="bold">4. Battery &amp; Inactivity Monitor</text>
    <text x="30" y="316" fill="#8b949e" font-size="9">12-bit ADC fuel gauge + sleep transitions</text>

    <text x="140" y="360" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">Zero RTOS Overhead / 32µs Latency</text>
  </g>

  <!-- Left: Inputs -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="90" y="24" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Input Hardware</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="10">• 30x Hall Sensors</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="10">• 4x 74HC165 Shift ICs</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="10">• SW2 Mode Pushbutton</text>
    <text x="15" y="110" fill="#c9d1d9" font-size="10">• SW3 Reset Pushbutton</text>
  </g>
  <line x1="210" y1="175" x2="260" y2="175" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left Bottom: Battery & ADC -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="90" y="24" fill="#a371f7" font-size="12" font-weight="bold" text-anchor="middle">Analog / Power</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="10">• 3.7V 500mAh LiPo</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="10">• GP26/ADC0 Voltage</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="10">• TP4056 USB-C Rail</text>
    <text x="15" y="108" fill="#8b949e" font-size="9">16-Sample Filter</text>
  </g>
  <line x1="210" y1="330" x2="260" y2="330" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Output Peripherals -->
  <g transform="translate(590, 180)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="90" y="24" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Visual Peripherals</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="10">• 0.96" SSD1306 OLED</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="10">• 400kHz Fast I2C Bus</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="10">• 128×64 Pixel Buffer</text>
    <text x="15" y="110" fill="#7ee787" font-size="10">• Live Score &amp; Gauge</text>
    <text x="15" y="130" fill="#e3b341" font-size="10">• Hardware Diagnostics</text>
    <text x="15" y="150" fill="#8b949e" font-size="9">30 FPS Partial Updates</text>
  </g>
  <line x1="540" y1="270" x2="590" y2="270" stroke="#388bfd" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
