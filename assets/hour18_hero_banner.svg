<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#090d13; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boardWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sqL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d6b88a"/>
    </linearGradient>
    <linearGradient id="sqD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5e3c"/>
      <stop offset="100%" stop-color="#5c3e27"/>
    </linearGradient>
    <filter id="glowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="520" fill="url(#heroBg)"/>

  <!-- Top Banner Header -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="38" fill="#38bdf8" font-size="22" font-weight="800">SUPREME CHESS SET</text>
    <text x="310" y="38" fill="#94a3b8" font-size="13" font-weight="600">Portable Magnetic Chess Set with Automated Capture-Tray Counter</text>
    <rect x="710" y="16" width="95" height="28" rx="6" fill="#047857"/>
    <text x="757" y="35" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">$26.85 BOM</text>
  </g>

  <!-- Main Playing Board Graphic in Isometric / Perspective View -->
  <g transform="translate(40, 115)">
    <!-- Board Base Outer Rim -->
    <rect x="0" y="0" width="460" height="370" rx="16" fill="url(#boardWood)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Left Capture Drawer Extended -->
    <g transform="translate(-25, 60)">
      <rect x="0" y="0" width="40" height="250" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="20" y="130" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 20 130)">WHITE CAPTURE TRAY</text>
      <!-- Captured piece dots -->
      <circle cx="20" cy="40" r="8" fill="#f59e0b"/>
      <text x="20" y="44" fill="#000000" font-size="9" font-weight="bold" text-anchor="middle">♛</text>
      <circle cx="20" cy="70" r="7" fill="#38bdf8"/>
      <text x="20" y="74" fill="#000000" font-size="8" font-weight="bold" text-anchor="middle">♜</text>
      <circle cx="20" cy="98" r="7" fill="#a855f7"/>
      <text x="20" y="102" fill="#000000" font-size="8" font-weight="bold" text-anchor="middle">♝</text>
      <circle cx="20" cy="190" r="6" fill="#94a3b8"/>
      <circle cx="20" cy="210" r="6" fill="#94a3b8"/>
    </g>

    <!-- Right Capture Drawer Extended -->
    <g transform="translate(445, 60)">
      <rect x="0" y="0" width="40" height="250" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="20" y="130" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90 20 130)">BLACK CAPTURE TRAY</text>
      <!-- Captured piece dots -->
      <circle cx="20" cy="40" r="7" fill="#38bdf8"/>
      <text x="20" y="44" fill="#000000" font-size="8" font-weight="bold" text-anchor="middle">♜</text>
      <circle cx="20" cy="65" r="7" fill="#10b981"/>
      <text x="20" y="69" fill="#000000" font-size="8" font-weight="bold" text-anchor="middle">♞</text>
      <circle cx="20" cy="180" r="6" fill="#94a3b8"/>
      <circle cx="20" cy="205" r="6" fill="#94a3b8"/>
      <circle cx="20" cy="230" r="6" fill="#94a3b8"/>
    </g>

    <!-- Central 8x8 Chess Playing Field -->
    <g transform="translate(30, 25)">
      <!-- 8x8 squares (400 x 320 px) -->
      <g>
        <!-- Repeat board tiles -->
        <rect x="0" y="0" width="50" height="40" fill="url(#sqL)"/>
        <rect x="50" y="0" width="50" height="40" fill="url(#sqD)"/>
        <rect x="100" y="0" width="50" height="40" fill="url(#sqL)"/>
        <rect x="150" y="0" width="50" height="40" fill="url(#sqD)"/>
        <rect x="200" y="0" width="50" height="40" fill="url(#sqL)"/>
        <rect x="250" y="0" width="50" height="40" fill="url(#sqD)"/>
        <rect x="300" y="0" width="50" height="40" fill="url(#sqL)"/>
        <rect x="350" y="0" width="50" height="40" fill="url(#sqD)"/>

        <!-- Middle Rows preview -->
        <rect x="0" y="40" width="400" height="240" fill="#1e293b" opacity="0.8"/>
        <text x="200" y="165" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">64 Magnetic Playing Squares</text>
        <text x="200" y="185" fill="#94a3b8" font-size="11" text-anchor="middle">Embedded 5x2mm Disc Magnets Under Every Tile</text>

        <!-- Bottom Row -->
        <rect x="0" y="280" width="50" height="40" fill="url(#sqD)"/>
        <rect x="50" y="280" width="50" height="40" fill="url(#sqL)"/>
        <rect x="100" y="280" width="50" height="40" fill="url(#sqD)"/>
        <rect x="150" y="280" width="50" height="40" fill="url(#sqL)"/>
        <rect x="200" y="280" width="50" height="40" fill="url(#sqD)"/>
        <rect x="250" y="280" width="50" height="40" fill="url(#sqL)"/>
        <rect x="300" y="280" width="50" height="40" fill="url(#sqD)"/>
        <rect x="350" y="280" width="50" height="40" fill="url(#sqL)"/>

        <!-- Chess Pieces Positioned on Board -->
        <circle cx="225" cy="300" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="225" y="306" fill="#000000" font-size="18" font-weight="bold" text-anchor="middle">♔</text>

        <circle cx="175" cy="300" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text x="175" y="306" fill="#000000" font-size="18" font-weight="bold" text-anchor="middle">♕</text>

        <circle cx="225" cy="20" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
        <text x="225" y="26" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">♚</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Live OLED Screen & Electronics Module -->
  <g transform="translate(540, 115)">
    <!-- Electronics Caddy Frame -->
    <rect x="0" y="0" width="320" height="370" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="28" fill="#a5b4fc" font-size="14" font-weight="bold">Live Match Display &amp; Controls</text>

    <!-- Embedded OLED Screen (Glowing Blue/Green) -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowHero)"/>
      
      <!-- Screen Header -->
      <text x="20" y="30" fill="#94a3b8" font-size="11" font-family="Courier, monospace">WHITE</text>
      <text x="70" y="35" fill="#38bdf8" font-size="24" font-weight="bold" font-family="Courier, monospace">17</text>

      <text x="160" y="30" fill="#94a3b8" font-size="11" font-family="Courier, monospace">BLACK</text>
      <text x="210" y="35" fill="#fbbf24" font-size="24" font-weight="bold" font-family="Courier, monospace">14</text>

      <line x1="15" y1="46" x2="265" y2="46" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Lead Status -->
      <text x="140" y="68" fill="#34d399" font-size="13" font-weight="bold" font-family="Courier, monospace" text-anchor="middle">★ WHITE LEAD: +3 ★</text>

      <!-- Gauge Bar -->
      <rect x="20" y="80" width="240" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
      <line x1="140" y1="80" x2="140" y2="98" stroke="#f59e0b" stroke-width="2"/>
      <rect x="141" y="83" width="36" height="12" fill="#10b981" rx="2"/>

      <!-- Footer Info -->
      <text x="20" y="120" fill="#94a3b8" font-size="10" font-family="Courier, monospace">CLOCK: 04:18 | 4.1V [|||]</text>
      <text x="20" y="136" fill="#64748b" font-size="9" font-family="Courier, monospace">CAPT: Q=1 R=1 N=1 P=4</text>
    </g>

    <!-- Control Buttons Plungers -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="130" height="45" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="25" cy="22" r="8" fill="#38bdf8"/>
      <text x="42" y="20" fill="#f8fafc" font-size="11" font-weight="bold">SW2 MODE</text>
      <text x="42" y="34" fill="#94a3b8" font-size="9">Cycle View / Clock</text>

      <rect x="150" y="0" width="130" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="175" cy="22" r="8" fill="#f59e0b"/>
      <text x="192" y="20" fill="#f8fafc" font-size="11" font-weight="bold">SW3 RESET</text>
      <text x="192" y="34" fill="#94a3b8" font-size="9">New Game (Hold 2s)</text>
    </g>

    <!-- Key Highlights Badge -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="280" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="22" fill="#38bdf8" font-size="11" font-weight="bold">Key System Specifications:</text>
      <text x="15" y="40" fill="#cbd5e1" font-size="10">• 30 Dedicated Hall-Effect Capture Sockets</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• RP2040 Dual ARM @ 133MHz • USB-C LiPo</text>
      <text x="15" y="72" fill="#34d399" font-size="10">• 21.8+ Hours Playtime • Sourced Total: $26.85</text>
    </g>
  </g>
</svg>
