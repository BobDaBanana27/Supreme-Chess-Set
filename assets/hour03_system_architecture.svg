<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">System Topology & Signal Flow Architecture</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 03 | Architecture</text>

  <!-- MCU Block in Center -->
  <g transform="translate(290, 180)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#1f242d" stroke="#58a6ff" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="30" rx="6" fill="#0d1117"/>
    <text x="110" y="30" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">RP2040-Zero MCU</text>
    <text x="110" y="60" fill="#c9d1d9" font-size="11" text-anchor="middle">Dual ARM Cortex-M0+ @ 133MHz</text>
    <text x="110" y="78" fill="#8b949e" font-size="10" text-anchor="middle">2MB Flash / 264KB SRAM</text>
    <text x="110" y="98" fill="#7ee787" font-size="10" text-anchor="middle">I2C Fast Mode • Shift Bus Engine</text>
    <text x="110" y="118" fill="#e3b341" font-size="10" text-anchor="middle">Onboard 3.3V LDO & USB-C</text>
  </g>

  <!-- Left: OLED Display & UI -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="180" height="150" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="90" y="26" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">0.96" OLED Display</text>
    <text x="90" y="44" fill="#8b949e" font-size="10" text-anchor="middle">SSD1306 (128×64)</text>

    <!-- Mini Screen graphics -->
    <rect x="15" y="55" width="150" height="50" rx="4" fill="#000000" stroke="#30363d"/>
    <text x="25" y="75" fill="#3fb950" font-size="11" font-family="Courier, monospace">W: 14 | B: 11</text>
    <text x="25" y="92" fill="#58a6ff" font-size="9" font-family="Courier, monospace">+3 W LEAD</text>

    <!-- Tactile Buttons -->
    <text x="90" y="125" fill="#c9d1d9" font-size="10" text-anchor="middle">SW1 Mode • SW2 Reset</text>
  </g>

  <!-- Connection: MCU to Display (I2C) -->
  <line x1="210" y1="240" x2="290" y2="240" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="260" x2="210" y2="260" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="232" fill="#58a6ff" font-size="9" font-weight="bold" text-anchor="middle">SDA (GP4)</text>
  <text x="250" y="278" fill="#58a6ff" font-size="9" font-weight="bold" text-anchor="middle">SCL (GP5)</text>

  <!-- Right: 4-Stage 74HC165 Shift Register Chain -->
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="200" height="210" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="100" y="26" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">4× 74HC165 Chain</text>
    <text x="100" y="42" fill="#8b949e" font-size="10" text-anchor="middle">32-Bit Serial Scanner Bus</text>

    <!-- 4 Sub-blocks -->
    <rect x="15" y="55" width="170" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
    <text x="25" y="74" fill="#7ee787" font-size="10">IC1: White Pawns 1–8</text>

    <rect x="15" y="92" width="170" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
    <text x="25" y="111" fill="#7ee787" font-size="10">IC2: W Knights, Bishops, Rooks, Q</text>

    <rect x="15" y="129" width="170" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
    <text x="25" y="148" fill="#e3b341" font-size="10">IC3: Black Pawns 1–8</text>

    <rect x="15" y="166" width="170" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
    <text x="25" y="185" fill="#e3b341" font-size="10">IC4: B Knights, Bishops, Rooks, Q</text>
  </g>

  <!-- Connection: MCU to Shift Register -->
  <line x1="510" y1="230" x2="570" y2="230" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="510" y1="250" x2="570" y2="250" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="270" x2="510" y2="270" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="540" y="222" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">PL Latch (GP10)</text>
  <text x="540" y="246" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">Clock (GP11)</text>
  <text x="540" y="286" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">Data In (GP12)</text>

  <!-- Top: Power & Battery Management -->
  <g transform="translate(260, 75)">
    <rect x="0" y="0" width="280" height="75" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="140" y="20" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">Power Subsystem (3.7V LiPo 500mAh)</text>
    <text x="140" y="38" fill="#c9d1d9" font-size="10" text-anchor="middle">TP4056 USB-C Charger + DW01A Battery Protection</text>
    <text x="140" y="55" fill="#8b949e" font-size="9" text-anchor="middle">Slide Switch SW3 -> RT9013 3.3V LDO -> 18+ Hours Play</text>
  </g>
  <line x1="400" y1="150" x2="400" y2="180" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: 30x Hall-Effect Sensor Array in Trays -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="600" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="300" y="22" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">Dedicated Capture-Tray Sensor Strips (30 Total Sockets)</text>
    <text x="300" y="38" fill="#8b949e" font-size="10" text-anchor="middle">White Tray: 8 Pawn + 2 Knight + 2 Bishop + 2 Rook + 1 Queen Sockets</text>
    <text x="300" y="54" fill="#8b949e" font-size="10" text-anchor="middle">Black Tray: 8 Pawn + 2 Knight + 2 Bishop + 2 Rook + 1 Queen Sockets</text>
  </g>
  <line x1="670" y1="360" x2="670" y2="410" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
</svg>
