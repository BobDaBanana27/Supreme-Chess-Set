<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">FIDE Material Scoring Engine & Mathematical Tally Logic</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 14 | Scoring Engine</text>

  <!-- Left: White Capture Tray Point Evaluation -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="350" height="390" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="20" y="28" fill="#58a6ff" font-size="14" font-weight="700">White Player Capture Tally</text>
    <text x="20" y="46" fill="#8b949e" font-size="11">Summing Black Pieces Seated in White's Tray</text>

    <!-- Piece Multipliers Table -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="320" height="40" rx="4" fill="#1c2128"/>
      <text x="15" y="25" fill="#f0e6d2" font-size="12" font-weight="bold">Queen Slot (Bit 14)</text>
      <text x="220" y="25" fill="#e3b341" font-size="12" font-weight="bold">1 × 9 = 9 pts</text>

      <rect x="0" y="48" width="320" height="40" rx="4" fill="#1c2128"/>
      <text x="15" y="25" fill="#f0e6d2" font-size="12" font-weight="bold">Rook Slots (Bits 12–13)</text>
      <text x="220" y="25" fill="#58a6ff" font-size="12" font-weight="bold">2 × 5 = 10 pts</text>

      <rect x="0" y="96" width="320" height="40" rx="4" fill="#1c2128"/>
      <text x="15" y="25" fill="#f0e6d2" font-size="12" font-weight="bold">Bishop Slots (Bits 10–11)</text>
      <text x="220" y="25" fill="#a371f7" font-size="12" font-weight="bold">2 × 3 = 6 pts</text>

      <rect x="0" y="144" width="320" height="40" rx="4" fill="#1c2128"/>
      <text x="15" y="25" fill="#f0e6d2" font-size="12" font-weight="bold">Knight Slots (Bits 8–9)</text>
      <text x="220" y="25" fill="#3fb950" font-size="12" font-weight="bold">2 × 3 = 6 pts</text>

      <rect x="0" y="192" width="320" height="40" rx="4" fill="#1c2128"/>
      <text x="15" y="25" fill="#f0e6d2" font-size="12" font-weight="bold">Pawn Slots (Bits 0–7)</text>
      <text x="220" y="25" fill="#79c0ff" font-size="12" font-weight="bold">8 × 1 = 8 pts</text>

      <!-- Max Sum Total -->
      <rect x="0" y="240" width="320" height="45" rx="4" fill="#1f3d2b" stroke="#238636" stroke-width="1.5"/>
      <text x="15" y="28" fill="#3fb950" font-size="13" font-weight="bold">Max White Material Total:</text>
      <text x="240" y="28" fill="#3fb950" font-size="15" font-weight="bold">39 PTS</text>
    </g>
  </g>

  <!-- Right: Material Advantage Computation & Display Gauge -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="390" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#7ee787" font-size="14" font-weight="700">Live Material Balance Delta</text>
    <text x="20" y="46" fill="#8b949e" font-size="11">Formula: Net Delta = White Score - Black Score</text>

    <!-- Math Calculation Box -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="310" height="120" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="30" fill="#c9d1d9" font-size="12">If White Captures: Q, N (9 + 3 = 12 pts)</text>
      <text x="20" y="55" fill="#c9d1d9" font-size="12">If Black Captures: R, P, P (5 + 1 + 1 = 7 pts)</text>
      <line x1="20" y1="70" x2="290" y2="70" stroke="#484f58" stroke-width="1"/>
      <text x="20" y="95" fill="#3fb950" font-size="15" font-weight="bold">Net Delta = +5 (White Lead)</text>
    </g>

    <!-- Visual Material Gauge Bar -->
    <g transform="translate(20, 205)">
      <text x="0" y="-8" fill="#8b949e" font-size="10" font-weight="bold">OLED DYNAMIC MATERIAL BALANCE BAR</text>
      <!-- Base 200px bar -->
      <rect x="0" y="0" width="310" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <!-- Center midline (Equal material) -->
      <line x1="155" y1="0" x2="155" y2="30" stroke="#f0883e" stroke-width="2"/>

      <!-- Lead fill to the left (White) or right (Black) -->
      <!-- Example: White +5 extends left from center by 45px -->
      <rect x="110" y="4" width="45" height="22" rx="3" fill="#3fb950"/>
      <text x="80" y="20" fill="#3fb950" font-size="11" font-weight="bold">W +5</text>
      <text x="155" y="45" fill="#8b949e" font-size="9" text-anchor="middle">0 (Parity)</text>
    </g>

    <!-- State Classification Badge -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="310" height="85" rx="6" fill="#1c2128" stroke="#388bfd"/>
      <text x="15" y="24" fill="#58a6ff" font-size="11" font-weight="bold">Lead Classification Enum:</text>
      <text x="15" y="44" fill="#c9d1d9" font-size="10">• LEAD_WHITE : Net Delta &gt; 0</text>
      <text x="15" y="60" fill="#c9d1d9" font-size="10">• LEAD_BLACK : Net Delta &lt; 0</text>
      <text x="15" y="76" fill="#c9d1d9" font-size="10">• LEAD_EQUAL : Net Delta == 0</text>
    </g>
  </g>
</svg>
