<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Exploded System CAD Assembly Architecture</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 12 | Assembly CAD</text>

  <!-- Exploded Assembly Stages from Top to Bottom -->
  <g transform="translate(100, 75)">
    <!-- Stage 1: Chess Pieces (Top) -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="360" height="40" rx="6" fill="#1f242d" stroke="#58a6ff" stroke-dasharray="3,2"/>
      <text x="180" y="24" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">1. Magnetic Chess Pieces (32 Pieces with Base Magnets)</text>
    </g>
    <line x1="300" y1="40" x2="300" y2="65" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 2: Board Grid Inlay -->
    <g transform="translate(80, 65)">
      <rect x="0" y="0" width="440" height="45" rx="6" fill="#2d3748" stroke="#388bfd" stroke-width="2"/>
      <text x="220" y="22" fill="#c9d1d9" font-size="12" font-weight="bold" text-anchor="middle">2. Magnetic Board Grid Inlay (160×80mm Half)</text>
      <text x="220" y="38" fill="#8b949e" font-size="9" text-anchor="middle">32 Blind Recesses with Press-Fit N35 Disc Magnets (North-Pole-Up)</text>
    </g>
    <line x1="300" y1="110" x2="300" y2="135" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 3: Slide-Out Capture Trays (Left & Right) -->
    <g transform="translate(40, 135)">
      <!-- Left Tray (White) -->
      <rect x="0" y="0" width="240" height="50" rx="6" fill="#1c2128" stroke="#238636" stroke-width="1.5"/>
      <text x="120" y="22" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">3A. White Capture Tray</text>
      <text x="120" y="38" fill="#8b949e" font-size="9" text-anchor="middle">15 Molded Piece Sockets (P, R, N, B, Q)</text>

      <!-- Right Tray (Black) -->
      <rect x="280" y="0" width="240" height="50" rx="6" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/>
      <text x="400" y="22" fill="#e3b341" font-size="11" font-weight="bold" text-anchor="middle">3B. Black Capture Tray</text>
      <text x="400" y="38" fill="#8b949e" font-size="9" text-anchor="middle">15 Molded Piece Sockets (P, R, N, B, Q)</text>
    </g>
    <line x1="160" y1="185" x2="160" y2="210" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="440" y1="185" x2="440" y2="210" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 4: Sensor Strip PCBs -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="240" height="35" rx="4" fill="#0e4429" stroke="#3fb950"/>
      <text x="120" y="22" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">4A. Sensor Strip PCB (15 Hall ICs)</text>

      <rect x="280" y="0" width="240" height="35" rx="4" fill="#0e4429" stroke="#3fb950"/>
      <text x="400" y="22" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">4B. Sensor Strip PCB (15 Hall ICs)</text>
    </g>
    <line x1="300" y1="245" x2="300" y2="270" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 5: Core Electronics & OLED Display Bezel -->
    <g transform="translate(80, 270)">
      <rect x="0" y="0" width="440" height="50" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
      <text x="220" y="22" fill="#a371f7" font-size="11" font-weight="bold" text-anchor="middle">5. Electronics Caddy & OLED Bezel Carrier</text>
      <text x="220" y="38" fill="#8b949e" font-size="9" text-anchor="middle">RP2040-Zero MCU • 0.96" OLED • TP4056 USB-C • 500mAh LiPo Cell</text>
    </g>
    <line x1="300" y1="320" x2="300" y2="345" stroke="#484f58" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 6: Base Chassis Shell (Bottom Foundation) -->
    <g transform="translate(40, 345)">
      <rect x="0" y="0" width="520" height="60" rx="8" fill="#1f242d" stroke="#58a6ff" stroke-width="2"/>
      <text x="260" y="25" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">6. Folding Clamshell Base Chassis (168 × 92 × 15 mm)</text>
      <text x="260" y="44" fill="#8b949e" font-size="10" text-anchor="middle">Dual Knuckle Hinge (Ø3mm Axis Pin) • Internal Slide Tracks • Magnetic Latch Corners</text>
    </g>
  </g>

  <!-- Right Floating Info Badge -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="100" height="80" rx="6" fill="#161b22" stroke="#238636"/>
    <text x="50" y="22" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">CAD SUITE</text>
    <text x="50" y="40" fill="#c9d1d9" font-size="9" text-anchor="middle">5x .FCStd</text>
    <text x="50" y="55" fill="#c9d1d9" font-size="9" text-anchor="middle">5x .STEP</text>
    <text x="50" y="70" fill="#7ee787" font-size="8" text-anchor="middle">FreeCAD 1.1</text>
  </g>
</svg>
