<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Magnetic Dipole Field Simulation & Sensor Stackup</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 04 | Physics & Tolerance</text>

  <!-- Left: Cross-Sectional Mechanical Assembly Stackup -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="370" height="390" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#7ee787" font-size="14" font-weight="700">Physical Cavity Stackup Cross-Section</text>
    <text x="20" y="44" fill="#8b949e" font-size="11">Chess Piece Seated in Molded Capture Socket</text>

    <!-- Chess Piece Base Cutaway -->
    <g transform="translate(95, 70)">
      <!-- Piece Stem -->
      <path d="M 60 0 L 120 0 L 110 50 L 70 50 Z" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
      <!-- Piece Base Flange -->
      <path d="M 50 50 L 130 50 L 140 100 L 40 100 Z" fill="#3b4252" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="90" y="80" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Chess Piece Base</text>

      <!-- 5x2mm Disc Magnet -->
      <rect x="65" y="82" width="50" height="15" rx="2" fill="#d73a49" stroke="#b31d28" stroke-width="1.5"/>
      <rect x="65" y="82" width="25" height="15" fill="#f85149"/>
      <text x="77" y="93" fill="#ffffff" font-size="9" font-weight="bold">N</text>
      <text x="102" y="93" fill="#ffffff" font-size="9" font-weight="bold">S</text>

      <!-- 0.8mm piece floor -->
      <rect x="40" y="97" width="100" height="5" fill="#2e3440"/>
      <text x="150" y="103" fill="#8b949e" font-size="9">0.8mm wall</text>

      <!-- 3D printed tray socket cradle -->
      <path d="M 20 105 L 35 105 L 35 125 L 145 125 L 145 105 L 160 105 L 160 145 L 20 145 Z" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
      <text x="90" y="140" fill="#c9d1d9" font-size="10" text-anchor="middle">Tray Socket Cradle</text>

      <!-- Hall Sensor TO-92 / SOT-23 on PCB -->
      <g transform="translate(68, 155)">
        <!-- PCB Substrate -->
        <rect x="-40" y="20" width="144" height="12" fill="#0e4429" stroke="#238636" stroke-width="1"/>
        <text x="32" y="29" fill="#7ee787" font-size="8" text-anchor="middle">Sensor Carrier PCB (1.6mm FR4)</text>

        <!-- Hall Sensor Package -->
        <rect x="12" y="0" width="20" height="20" rx="3" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
        <circle cx="22" cy="10" r="3" fill="#e3b341"/>
        <text x="22" y="13" fill="#000000" font-size="6" font-weight="bold" text-anchor="middle">H</text>
        <text x="40" y="14" fill="#e3b341" font-size="9">Hall IC</text>
      </g>

      <!-- Total stackup dimension line -->
      <line x1="25" y1="97" x2="25" y2="155" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="18" y="130" fill="#58a6ff" font-size="10" text-anchor="end" font-weight="bold">Z = 2.2 mm</text>
    </g>

    <text x="20" y="360" fill="#3fb950" font-size="11" font-weight="bold">✓ Seated Flux: 385 Gauss >> 40 Gauss Bop Threshold</text>
  </g>

  <!-- Right: Biot-Savart Magnetic Flux vs Distance Curve -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="390" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#58a6ff" font-size="14" font-weight="700">Magnetic Flux Density vs Distance B(z)</text>
    <text x="20" y="44" fill="#8b949e" font-size="11">Biot-Savart Analytical Model for 5×2mm N35 Magnet</text>

    <!-- Graph Coordinates -->
    <g transform="translate(45, 60)">
      <!-- Axes -->
      <line x1="0" y1="240" x2="270" y2="240" stroke="#484f58" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="240" stroke="#484f58" stroke-width="1.5"/>

      <!-- Axis Labels -->
      <text x="135" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Vertical Distance z (mm)</text>
      <text x="-120" y="-30" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90)">Flux B(z) (Gauss)</text>

      <!-- Grid lines -->
      <line x1="0" y1="60" x2="270" y2="60" stroke="#21262d" stroke-width="1"/>
      <text x="-8" y="64" fill="#6e7681" font-size="9" text-anchor="end">1000 G</text>

      <line x1="0" y1="120" x2="270" y2="120" stroke="#21262d" stroke-width="1"/>
      <text x="-8" y="124" fill="#6e7681" font-size="9" text-anchor="end">500 G</text>

      <line x1="0" y1="180" x2="270" y2="180" stroke="#21262d" stroke-width="1"/>
      <text x="-8" y="184" fill="#6e7681" font-size="9" text-anchor="end">100 G</text>

      <!-- Operate & Release Bands -->
      <rect x="0" y="226" width="270" height="8" fill="#d29922" opacity="0.3"/>
      <line x1="0" y1="228" x2="270" y2="228" stroke="#e3b341" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="275" y="231" fill="#e3b341" font-size="8">Bop (40G)</text>

      <line x1="0" y1="234" x2="270" y2="234" stroke="#f85149" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="275" y="238" fill="#f85149" font-size="8">Brp (20G)</text>

      <!-- B-Field Exponential Curve -->
      <path d="M 0 10 Q 20 80 40 140 T 70 185 T 120 220 T 180 236 T 260 239" fill="none" stroke="#58a6ff" stroke-width="3"/>

      <!-- Operating Point Point Highlight (z = 2.2mm, B = 385G) -->
      <circle cx="50" cy="148" r="5" fill="#3fb950"/>
      <line x1="50" y1="148" x2="50" y2="240" stroke="#3fb950" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="50" y="255" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">2.2mm</text>
      <text x="60" y="140" fill="#3fb950" font-size="10" font-weight="bold">Seated: 385 G (7.7× safety margin)</text>

      <!-- Neighbor Pitch Point (r = 18mm) -->
      <circle cx="240" cy="239" r="4" fill="#8b949e"/>
      <line x1="240" y1="239" x2="240" y2="240" stroke="#8b949e" stroke-width="1"/>
      <text x="240" y="255" fill="#8b949e" font-size="9" text-anchor="middle">18mm</text>
      <text x="220" y="225" fill="#8b949e" font-size="9" text-anchor="end">Neighbor < 3 G (Zero False Triggers)</text>
    </g>

    <text x="25" y="365" fill="#c9d1d9" font-size="10">Clean 15 Gauss hysteresis guarantees zero debounce bounce.</text>
  </g>
</svg>
