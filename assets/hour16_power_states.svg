<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Power Management & Inactivity State Machine</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 16 | Power Engineering</text>

  <!-- State 1: Active Play (23.5 mA) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#1f3d2b" stroke="#238636" stroke-width="2"/>
    <text x="100" y="30" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">STATE: ACTIVE PLAY</text>
    <text x="100" y="55" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">23.5 mA</text>
    <text x="100" y="78" fill="#c9d1d9" font-size="10" text-anchor="middle">133MHz Dual Cortex-M0+</text>
    <text x="100" y="96" fill="#c9d1d9" font-size="10" text-anchor="middle">100% OLED Brightness</text>
    <text x="100" y="114" fill="#7ee787" font-size="10" text-anchor="middle">50ms Fast Scan Loop</text>
    <text x="100" y="134" fill="#8b949e" font-size="9" text-anchor="middle">Runtime: 21.3 Hours</text>
  </g>

  <!-- Transition: 5 Min Inactivity -->
  <line x1="260" y1="160" x2="310" y2="160" stroke="#e3b341" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="285" y="150" fill="#e3b341" font-size="9" text-anchor="middle">5 Min Inactive</text>

  <!-- State 2: Dimmed Mode (4.8 mA) -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#1c2128" stroke="#d29922" stroke-width="2"/>
    <text x="100" y="30" fill="#e3b341" font-size="13" font-weight="bold" text-anchor="middle">STATE: DIMMED</text>
    <text x="100" y="55" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">4.8 mA</text>
    <text x="100" y="78" fill="#c9d1d9" font-size="10" text-anchor="middle">12MHz Low Power Tick</text>
    <text x="100" y="96" fill="#c9d1d9" font-size="10" text-anchor="middle">10% OLED Standby Dim</text>
    <text x="100" y="114" fill="#8b949e" font-size="10" text-anchor="middle">500ms Relaxed Scan</text>
    <text x="100" y="134" fill="#8b949e" font-size="9" text-anchor="middle">Runtime: 104 Hours</text>
  </g>

  <!-- Transition: 10 Min Inactivity or Low Batt -->
  <line x1="510" y1="160" x2="560" y2="160" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="150" fill="#f85149" font-size="9" text-anchor="middle">10 Min Inactive</text>

  <!-- State 3: Deep Dormant Sleep (35 µA) -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="180" height="150" rx="10" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <text x="90" y="30" fill="#8b949e" font-size="12" font-weight="bold" text-anchor="middle">STATE: DORMANT</text>
    <text x="90" y="55" fill="#f85149" font-size="18" font-weight="bold" text-anchor="middle">35 µA</text>
    <text x="90" y="78" fill="#8b949e" font-size="10" text-anchor="middle">XOSC Stopped</text>
    <text x="90" y="96" fill="#8b949e" font-size="10" text-anchor="middle">OLED Power Off</text>
    <text x="90" y="114" fill="#8b949e" font-size="10" text-anchor="middle">GPIO Interrupt Wake</text>
    <text x="90" y="134" fill="#3fb950" font-size="9" text-anchor="middle">Standby: &gt; 1.5 Years</text>
  </g>

  <!-- Wakeup Loop Line from Dormant to Active -->
  <path d="M 650 250 L 650 310 L 160 310 L 160 250" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="400" y="300" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">Instant Wake: Button Press (SW2/SW3) or Magnet Trigger</text>

  <!-- Bottom: Charging Subsystem Architecture -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="680" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="24" fill="#58a6ff" font-size="12" font-weight="bold">USB-C Charging &amp; Battery Health (TP4056 + DW01A):</text>
    <text x="20" y="46" fill="#c9d1d9" font-size="10">• CC/CV 250mA charging current (0.5C safe profile) • Full recharge in 2.2 hours from empty</text>
    <text x="20" y="66" fill="#c9d1d9" font-size="10">• Overvoltage clamp at 4.20V ±1% • Undervoltage cut-off at 2.40V prevents cell swelling</text>
    <text x="20" y="86" fill="#7ee787" font-size="10">✓ Live voltage monitor updates battery fuel gauge on OLED every 10 seconds</text>
  </g>
</svg>
