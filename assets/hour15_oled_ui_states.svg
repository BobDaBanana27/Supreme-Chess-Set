<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">0.96" SSD1306 OLED UI State Machine — 3-Screen Layout</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 15 | OLED UI</text>

  <!-- 3 OLED Screen Windows in a row -->

  <!-- Screen 1: Main Live Scoreboard -->
  <g transform="translate(20, 76)">
    <rect x="0" y="0" width="246" height="310" rx="10" fill="#05070a" stroke="#58a6ff" stroke-width="2"/>
    <text x="12" y="22" fill="#58a6ff" font-size="11" font-weight="bold">MODE 1: LIVE SCOREBOARD</text>
    <line x1="8" y1="30" x2="238" y2="30" stroke="#30363d" stroke-width="1"/>

    <!-- Score content -->
    <text x="14" y="62" fill="#8b949e" font-size="11">WHITE:</text>
    <text x="68" y="66" fill="#ffffff" font-size="22" font-weight="bold" font-family="Courier, monospace">14</text>

    <text x="130" y="62" fill="#8b949e" font-size="11">BLACK:</text>
    <text x="184" y="66" fill="#ffffff" font-size="22" font-weight="bold" font-family="Courier, monospace">11</text>

    <line x1="8" y1="78" x2="238" y2="78" stroke="#30363d" stroke-width="1"/>

    <text x="123" y="102" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">WHITE ADVANTAGE: +3</text>

    <!-- Gauge Bar -->
    <rect x="20" y="114" width="206" height="16" rx="3" fill="#161b22" stroke="#484f58"/>
    <line x1="123" y1="114" x2="123" y2="130" stroke="#f0883e" stroke-width="2"/>
    <!-- Lead box extending right -->
    <rect x="124" y="117" width="28" height="10" fill="#3fb950" rx="2"/>

    <!-- Bottom piece tally -->
    <text x="14" y="166" fill="#c9d1d9" font-size="10" font-family="Courier, monospace">W: Q N P3</text>
    <text x="150" y="166" fill="#58a6ff" font-size="10" font-family="Courier, monospace">4.1V [|||]</text>

    <!-- SW2 label -->
    <rect x="14" y="276" width="218" height="22" rx="4" fill="#161b22" stroke="#388bfd"/>
    <text x="123" y="291" fill="#58a6ff" font-size="10" text-anchor="middle">SW2 → cycle to Mode 2</text>
  </g>

  <!-- Screen 2: Detailed Captured Pieces -->
  <g transform="translate(284, 76)">
    <rect x="0" y="0" width="246" height="310" rx="10" fill="#05070a" stroke="#388bfd" stroke-width="1.5"/>
    <text x="12" y="22" fill="#58a6ff" font-size="11" font-weight="bold">MODE 2: PIECE ROSTER</text>
    <line x1="8" y1="30" x2="238" y2="30" stroke="#30363d" stroke-width="1"/>

    <text x="14" y="60" fill="#7ee787" font-size="12" font-weight="bold">White captures:</text>
    <text x="24" y="82" fill="#ffffff" font-size="12" font-family="Courier, monospace">K:0 Q:1 R:1 B:0</text>
    <text x="24" y="100" fill="#ffffff" font-size="12" font-family="Courier, monospace">N:1 P:3</text>

    <line x1="8" y1="118" x2="238" y2="118" stroke="#30363d" stroke-width="1"/>

    <text x="14" y="146" fill="#e3b341" font-size="12" font-weight="bold">Black captures:</text>
    <text x="24" y="168" fill="#ffffff" font-size="12" font-family="Courier, monospace">K:0 Q:0 R:2 B:0</text>
    <text x="24" y="186" fill="#ffffff" font-size="12" font-family="Courier, monospace">N:0 P:1</text>

    <text x="14" y="232" fill="#8b949e" font-size="10">King slot = travel cradle (0 pts)</text>

    <rect x="14" y="276" width="218" height="22" rx="4" fill="#161b22" stroke="#388bfd"/>
    <text x="123" y="291" fill="#58a6ff" font-size="10" text-anchor="middle">SW2 → cycle to Mode 3</text>
  </g>

  <!-- Screen 3: Hardware & Battery Diagnostics -->
  <g transform="translate(548, 76)">
    <rect x="0" y="0" width="234" height="310" rx="10" fill="#05070a" stroke="#e3b341" stroke-width="1.5"/>
    <text x="12" y="22" fill="#e3b341" font-size="11" font-weight="bold">MODE 3: DIAGNOSTICS</text>
    <line x1="8" y1="30" x2="226" y2="30" stroke="#30363d" stroke-width="1"/>

    <text x="14" y="62" fill="#c9d1d9" font-size="11">Battery Voltage:</text>
    <text x="14" y="80" fill="#3fb950" font-size="12" font-weight="bold" font-family="Courier, monospace">4.12 V (92%)</text>

    <text x="14" y="106" fill="#c9d1d9" font-size="11">Est. Play Runtime:</text>
    <text x="14" y="124" fill="#7ee787" font-size="12" font-weight="bold">~21.4 Hours</text>

    <text x="14" y="150" fill="#c9d1d9" font-size="11">W-Bits: 0x1F03</text>
    <text x="14" y="170" fill="#c9d1d9" font-size="11">B-Bits: 0x0001</text>

    <text x="14" y="196" fill="#8b949e" font-size="10">Sensor: 30/30 OK (32µs)</text>
    <text x="14" y="212" fill="#8b949e" font-size="10">Current draw: 22.4 mA</text>

    <rect x="10" y="276" width="214" height="22" rx="4" fill="#161b22" stroke="#e3b341"/>
    <text x="117" y="291" fill="#e3b341" font-size="10" text-anchor="middle">SW2 → back to Mode 1</text>
  </g>

  <!-- Bottom legend: SW2 cycles 1→2→3→1 -->
  <rect x="20" y="398" width="760" height="1" fill="#30363d"/>
</svg>
