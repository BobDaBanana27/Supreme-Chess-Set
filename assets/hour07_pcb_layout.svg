<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">PCB Physical Layout & Copper Routing (KiCad 10)</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 07 | PCB Design</text>

  <!-- Left: Core Motherboard PCB (75 x 48 mm) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="360" height="270" rx="12" fill="#0f2d1e" stroke="#238636" stroke-width="2"/>
    <rect x="10" y="10" width="340" height="25" rx="4" fill="#0b2116"/>
    <text x="180" y="27" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">SUPREME CHESS CORE MOTHERBOARD (75×48mm)</text>

    <!-- RP2040-Zero SMD Outline -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="90" height="120" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="45" y="20" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">RP2040-Zero</text>
      <!-- Castellated Pins Left -->
      <circle cx="0" cy="35" r="3" fill="#e3b341"/>
      <circle cx="0" cy="50" r="3" fill="#e3b341"/>
      <circle cx="0" cy="65" r="3" fill="#e3b341"/>
      <circle cx="0" cy="80" r="3" fill="#e3b341"/>
      <circle cx="0" cy="95" r="3" fill="#e3b341"/>
      <!-- Castellated Pins Right -->
      <circle cx="90" cy="35" r="3" fill="#e3b341"/>
      <circle cx="90" cy="50" r="3" fill="#e3b341"/>
      <circle cx="90" cy="65" r="3" fill="#e3b341"/>
      <circle cx="90" cy="80" r="3" fill="#e3b341"/>
      <circle cx="90" cy="95" r="3" fill="#e3b341"/>
    </g>

    <!-- SSD1306 OLED Header -->
    <g transform="translate(200, 60)">
      <rect x="0" y="0" width="120" height="70" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
      <text x="60" y="20" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">OLED 0.96" Header</text>
      <circle cx="25" cy="45" r="4" fill="#d29922"/>
      <circle cx="48" cy="45" r="4" fill="#d29922"/>
      <circle cx="71" cy="45" r="4" fill="#d29922"/>
      <circle cx="94" cy="45" r="4" fill="#d29922"/>
      <text x="60" y="60" fill="#8b949e" font-size="8" text-anchor="middle">GND  3V3  SCL  SDA</text>
    </g>

    <!-- FFC Sensor Bus Header J1 -->
    <g transform="translate(160, 160)">
      <rect x="0" y="0" width="160" height="40" rx="4" fill="#161b22" stroke="#7ee787"/>
      <text x="80" y="16" fill="#7ee787" font-size="9" font-weight="bold" text-anchor="middle">J1: 6-PIN FFC CONNECTOR</text>
      <!-- Pins -->
      <line x1="20" y1="28" x2="140" y2="28" stroke="#e3b341" stroke-width="2" stroke-dasharray="8,12"/>
    </g>

    <!-- 4x M2.5 Mounting Holes -->
    <circle cx="16" cy="16" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <circle cx="344" cy="16" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <circle cx="16" cy="254" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
    <circle cx="344" cy="254" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>

    <!-- Routed Traces -->
    <path d="M 130 95 L 170 95 L 200 105" fill="none" stroke="#e3b341" stroke-width="2"/>
    <path d="M 130 110 L 160 110 L 223 105" fill="none" stroke="#e3b341" stroke-width="2"/>
    <path d="M 130 140 L 150 140 L 180 160" fill="none" stroke="#3fb950" stroke-width="2"/>
    <path d="M 130 155 L 160 155 L 200 160" fill="none" stroke="#3fb950" stroke-width="2"/>
  </g>

  <!-- Right: Stackup & DRC Specs -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="270" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#58a6ff" font-size="14" font-weight="700">PCB Layer Stackup & DRC Rules</text>
    <text x="20" y="46" fill="#8b949e" font-size="11">Standard 2-Layer FR-4 Specification (JLCPCB Tier)</text>

    <!-- Stackup diagram -->
    <g transform="translate(20, 60)">
      <!-- Top Solder Mask -->
      <rect x="0" y="0" width="310" height="8" fill="#238636" rx="2"/>
      <text x="10" y="7" fill="#ffffff" font-size="7">F.Mask (0.01mm Matte Black/Green)</text>

      <!-- Top Copper F.Cu -->
      <rect x="0" y="10" width="310" height="12" fill="#d29922" rx="2"/>
      <text x="10" y="19" fill="#0d1117" font-size="8" font-weight="bold">F.Cu (1 oz / 0.035mm Copper: Signal & Power)</text>

      <!-- FR4 Core -->
      <rect x="0" y="24" width="310" height="34" fill="#30363d" rx="2"/>
      <text x="155" y="45" fill="#c9d1d9" font-size="10" font-weight="bold" text-anchor="middle">FR-4 Dielectric Core (1.51mm / εr = 4.5)</text>

      <!-- Bottom Copper B.Cu -->
      <rect x="0" y="60" width="310" height="12" fill="#d29922" rx="2"/>
      <text x="10" y="69" fill="#0d1117" font-size="8" font-weight="bold">B.Cu (1 oz / 0.035mm Solid Ground Plane)</text>

      <!-- Bottom Mask -->
      <rect x="0" y="74" width="310" height="8" fill="#238636" rx="2"/>
      <text x="10" y="81" fill="#ffffff" font-size="7">B.Mask (0.01mm)</text>
    </g>

    <!-- DRC Metrics Table -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="310" height="95" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="15" y="20" fill="#7ee787" font-size="10" font-weight="bold">Trace Width / Clearance:</text>
      <text x="210" y="20" fill="#c9d1d9" font-size="10">0.20 mm / 0.20 mm (8/8 mil)</text>

      <text x="15" y="40" fill="#7ee787" font-size="10" font-weight="bold">Min Via Drill / Diameter:</text>
      <text x="210" y="40" fill="#c9d1d9" font-size="10">0.30 mm / 0.60 mm</text>

      <text x="15" y="60" fill="#7ee787" font-size="10" font-weight="bold">Copper Thickness:</text>
      <text x="210" y="60" fill="#c9d1d9" font-size="10">1 oz (35 µm)</text>

      <text x="15" y="80" fill="#7ee787" font-size="10" font-weight="bold">Board Finish:</text>
      <text x="210" y="80" fill="#c9d1d9" font-size="10">Lead-Free HASL / ENIG</text>
    </g>
  </g>

  <!-- Bottom: 15-Slot Sensor Strip PCB Render (155 x 22 mm) -->
  <g transform="translate(30, 370)">
    <rect x="0" y="0" width="740" height="105" rx="10" fill="#0f2d1e" stroke="#238636" stroke-width="2"/>
    <text x="20" y="22" fill="#3fb950" font-size="12" font-weight="bold">15-SLOT CAPTURE TRAY SENSOR STRIP PCB (155 × 22 mm)</text>
    <text x="640" y="22" fill="#8b949e" font-size="10">Pitch: 9.2 mm per socket</text>

    <!-- FFC Port -->
    <rect x="15" y="35" width="25" height="50" rx="3" fill="#161b22" stroke="#7ee787"/>
    <text x="27" y="62" fill="#7ee787" font-size="8" text-anchor="middle" transform="rotate(-90 27 62)">FFC IN</text>

    <!-- 2x 74HC165 Shift Registers -->
    <rect x="140" y="42" width="65" height="35" rx="3" fill="#161b22" stroke="#3fb950"/>
    <text x="172" y="63" fill="#3fb950" font-size="9" text-anchor="middle">74HC165 (1)</text>

    <rect x="420" y="42" width="65" height="35" rx="3" fill="#161b22" stroke="#3fb950"/>
    <text x="452" y="63" fill="#3fb950" font-size="9" text-anchor="middle">74HC165 (2)</text>

    <!-- 15 Hall Sensors along center line -->
    <g transform="translate(50, 48)">
      <!-- 15 sensors -->
      <circle cx="15" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="55" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="95" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="135" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="175" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="215" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="255" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="295" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="375" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="415" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="455" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="495" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="535" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="575" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
      <circle cx="615" cy="12" r="6" fill="#e3b341" stroke="#000000"/>
    </g>
    <text x="370" y="98" fill="#c9d1d9" font-size="9" text-anchor="middle">15x SOT-23 Hall Elements Centered Directly Under Molded Piece Wells</text>
  </g>
</svg>
