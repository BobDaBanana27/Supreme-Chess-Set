<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Electrical Schematic — Core MCU, Display & Power Tree</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 05 | Schematic</text>

  <!-- RP2040-Zero Microcontroller Block -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="15" y="12" width="270" height="28" rx="4" fill="#0d1117"/>
    <text x="150" y="31" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">U1: RP2040-Zero (Waveshare)</text>

    <!-- Left Pins (Power, I2C, Buttons) -->
    <text x="12" y="75" fill="#e3b341" font-size="10" font-family="Courier">VIN (5V/BAT)</text>
    <text x="12" y="105" fill="#3fb950" font-size="10" font-family="Courier">3V3_OUT</text>
    <text x="12" y="135" fill="#8b949e" font-size="10" font-family="Courier">GND</text>
    <text x="12" y="175" fill="#58a6ff" font-size="10" font-family="Courier">GP4 (I2C0_SDA)</text>
    <text x="12" y="205" fill="#58a6ff" font-size="10" font-family="Courier">GP5 (I2C0_SCL)</text>
    <text x="12" y="240" fill="#a371f7" font-size="10" font-family="Courier">GP2 (BTN_MODE)</text>
    <text x="12" y="265" fill="#a371f7" font-size="10" font-family="Courier">GP3 (BTN_RESET)</text>

    <!-- Right Pins (Shift Register Control) -->
    <text x="288" y="75" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">GP10 (SR_LOAD / PL)</text>
    <text x="288" y="105" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">GP11 (SR_CLK / CP)</text>
    <text x="288" y="135" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">GP12 (SR_DATA / Q7)</text>
    <text x="288" y="175" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">GP0 (TRAY_W_EN)</text>
    <text x="288" y="205" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">GP1 (TRAY_B_EN)</text>
    <text x="288" y="245" fill="#e3b341" font-size="10" font-family="Courier" text-anchor="end">GP26 (VBAT_ADC)</text>
  </g>

  <!-- Left: OLED Display Module (I2C) -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="160" height="130" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="80" y="24" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">DISP1: SSD1306</text>
    <text x="80" y="40" fill="#8b949e" font-size="10" text-anchor="middle">128×64 OLED (0.96")</text>

    <text x="150" y="65" fill="#3fb950" font-size="10" font-family="Courier" text-anchor="end">Pin 1: VCC (3.3V)</text>
    <text x="150" y="85" fill="#8b949e" font-size="10" font-family="Courier" text-anchor="end">Pin 2: GND</text>
    <text x="150" y="105" fill="#58a6ff" font-size="10" font-family="Courier" text-anchor="end">Pin 3: SCL</text>
    <text x="150" y="122" fill="#58a6ff" font-size="10" font-family="Courier" text-anchor="end">Pin 4: SDA</text>
  </g>
  <line x1="190" y1="285" x2="250" y2="255" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="190" y1="265" x2="250" y2="285" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- Left Top: Power Subsystem (TP4056 + LiPo) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="80" y="20" fill="#e3b341" font-size="11" font-weight="bold" text-anchor="middle">MOD1: TP4056 USB-C</text>
    <text x="15" y="42" fill="#c9d1d9" font-size="9">USB 5V In -> Charger</text>
    <text x="15" y="58" fill="#7ee787" font-size="9">3.7V LiPo 500mAh</text>
    <text x="15" y="74" fill="#e3b341" font-size="9">SW1 Power Switch -> VIN</text>
  </g>
  <line x1="190" y1="120" x2="250" y2="155" stroke="#e3b341" stroke-width="2"/>

  <!-- Right: Tray Shift Register Interconnect Header -->
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="160" height="240" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="80" y="24" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">J1: Sensor Bus</text>
    <text x="80" y="40" fill="#8b949e" font-size="9" text-anchor="middle">6-Pin FFC Cable to Trays</text>

    <text x="15" y="70" fill="#3fb950" font-size="10" font-family="Courier">Pin 1: 3.3V VCC</text>
    <text x="15" y="95" fill="#8b949e" font-size="10" font-family="Courier">Pin 2: GND</text>
    <text x="15" y="125" fill="#7ee787" font-size="10" font-family="Courier">Pin 3: SR_LOAD</text>
    <text x="15" y="155" fill="#7ee787" font-size="10" font-family="Courier">Pin 4: SR_CLK</text>
    <text x="15" y="185" fill="#7ee787" font-size="10" font-family="Courier">Pin 5: SR_DATA_W</text>
    <text x="15" y="215" fill="#e3b341" font-size="10" font-family="Courier">Pin 6: SR_DATA_B</text>
  </g>
  <line x1="550" y1="155" x2="610" y2="195" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="550" y1="185" x2="610" y2="225" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="550" y1="215" x2="610" y2="255" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Footer Info -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="740" height="75" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="26" fill="#c9d1d9" font-size="12" font-weight="bold">Schematic Features & Safety Systems:</text>
    <text x="20" y="46" fill="#8b949e" font-size="11">• Dual ESD diode clamping on USB lines • DW01A LiPo cut-off at 2.4V to prevent cell degradation</text>
    <text x="20" y="64" fill="#8b949e" font-size="11">• 4.7kΩ I2C pull-ups • 100nF decoupling per IC • Standby quiescent current: &lt; 25µA in sleep</text>
  </g>
</svg>
