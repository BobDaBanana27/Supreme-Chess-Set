<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="34" fill="#58a6ff" font-size="19" font-weight="700">Magnetic Board Grid & Blind Pocket Array CAD</text>
  <text x="640" y="34" fill="#8b949e" font-size="13" font-weight="600">Hour 09 | CAD Board</text>

  <!-- Left: 4x8 Grid Surface Rendering -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="440" height="250" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="20" y="24" fill="#58a6ff" font-size="13" font-weight="bold">Board Grid Half Insert (160.0 × 80.0 mm)</text>

    <!-- 4 rows x 8 cols grid -->
    <g transform="translate(20, 40)">
      <!-- 8 cols x 4 rows squares: 48px each scaled -->
      <!-- Row 0 -->
      <rect x="0" y="0" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="48" y="0" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="96" y="0" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="144" y="0" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="192" y="0" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="240" y="0" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="288" y="0" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="336" y="0" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>

      <!-- Row 1 -->
      <rect x="0" y="42" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="48" y="42" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="96" y="42" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="144" y="42" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="192" y="42" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="240" y="42" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="288" y="42" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="336" y="42" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>

      <!-- Row 2 -->
      <rect x="0" y="84" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="48" y="84" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="96" y="84" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="144" y="84" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="192" y="84" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="240" y="84" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="288" y="84" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="336" y="84" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>

      <!-- Row 3 -->
      <rect x="0" y="126" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="48" y="126" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="96" y="126" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="144" y="126" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="192" y="126" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="240" y="126" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>
      <rect x="288" y="126" width="48" height="42" fill="#8b5e3c" stroke="#5c3e27"/>
      <rect x="336" y="126" width="48" height="42" fill="#d6b88a" stroke="#8b5e3c"/>

      <!-- Center Magnet Markers on every square -->
      <circle cx="24" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="72" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="120" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="168" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="216" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="264" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="312" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
      <circle cx="360" cy="21" r="5" fill="#f85149" stroke="#ffffff"/>
    </g>

    <text x="220" y="235" fill="#8b949e" font-size="10" text-anchor="middle">32 Blind Recesses (Ø5.2 × 2.2 mm) Underneath Tiles</text>
  </g>

  <!-- Right: Bottom View Cavity Stackup -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="270" height="390" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="18" y="26" fill="#7ee787" font-size="13" font-weight="bold">Magnet Inlay Details</text>
    <text x="18" y="44" fill="#8b949e" font-size="11">FreeCAD Model: cad/board_grid_half.FCStd</text>

    <!-- Cross Section View -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="230" height="85" rx="4" fill="#0d1117" stroke="#484f58"/>
      <!-- Top skin 1.3mm -->
      <rect x="10" y="10" width="210" height="20" fill="#d6b88a"/>
      <text x="115" y="24" fill="#000000" font-size="9" font-weight="bold" text-anchor="middle">1.3mm Top Solid Skin</text>

      <!-- Blind Magnet Pockets (2.2mm depth) -->
      <rect x="25" y="30" width="40" height="35" fill="#f85149" stroke="#d73a49"/>
      <text x="45" y="52" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">N35</text>

      <rect x="95" y="30" width="40" height="35" fill="#f85149" stroke="#d73a49"/>
      <text x="115" y="52" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">N35</text>

      <rect x="165" y="30" width="40" height="35" fill="#f85149" stroke="#d73a49"/>
      <text x="185" y="52" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">N35</text>

      <text x="115" y="78" fill="#8b949e" font-size="8" text-anchor="middle">Ø5.2mm × 2.2mm Press-Fit Cavities</text>
    </g>

    <!-- Key Mechanical Attributes -->
    <g transform="translate(20, 175)">
      <text x="0" y="20" fill="#c9d1d9" font-size="11" font-weight="bold">Magnetic Specs:</text>
      <text x="0" y="40" fill="#58a6ff" font-size="10">• Disc Magnet: Ø5.0 × 2.0 mm</text>
      <text x="0" y="58" fill="#58a6ff" font-size="10">• Retention Force: ~55 gf per piece</text>
      <text x="0" y="76" fill="#3fb950" font-size="10">• All board magnets: NORTH UP</text>

      <text x="0" y="110" fill="#c9d1d9" font-size="11" font-weight="bold">Self-Centering Snap:</text>
      <text x="0" y="130" fill="#8b949e" font-size="10">• Pieces automatically pull to square</text>
      <text x="0" y="148" fill="#8b949e" font-size="10">  center when released within ±3mm</text>

      <text x="0" y="180" fill="#e3b341" font-size="11" font-weight="bold">Exported: .FCStd and .step files</text>
    </g>
  </g>

  <!-- Bottom Left: Assembly Integration -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="440" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="24" fill="#c9d1d9" font-size="12" font-weight="bold">Seamless Hinge Unfold</text>
    <text x="20" y="46" fill="#8b949e" font-size="10">• Both halves meet along central axis with zero vertical step-gap (&lt; 0.1 mm)</text>
    <text x="20" y="66" fill="#8b949e" font-size="10">• Total unfolded arena: 160.0 × 160.0 mm playing surface</text>
    <text x="20" y="86" fill="#7ee787" font-size="10">✓ Retains pieces even at full 90° vertical inclination or severe vibration</text>
  </g>
</svg>
